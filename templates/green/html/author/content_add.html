<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
        <title>作家管理系统-小说精品屋</title>
        <link rel="stylesheet" href="/css/base.css?v=1"/>
        <link rel="stylesheet" href="/css/user.css"/>
        <link rel="stylesheet" href="/css/author.css"/>
        <style>
            /* 编辑器容器样式 */
            .editor-container {
                margin: 10px 0px;
                padding: 20px;
                background: #fff;
                border-radius: 8px;
                box-shadow: 0 2px 12px 0 rgba(0, 0, 0, .1);
            }

            /* 文本域样式 */
            #bookContent {
                width: 93%;
                height: 400px;
                padding: 15px;
                border: 1px solid #e6e6e6;
                border-radius: 4px;
                font-size: 14px;
                line-height: 1.6;
                resize: vertical;
            }

            /* 工具栏样式 */
            .ai-toolbar {
                margin-bottom: 15px;
                display: flex;
                gap: 10px; /* 按钮间距 */
            }

            /* 自定义链接按钮样式 */
            .ai-link {
                display: inline-block;
                padding: 10px 20px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
                color: #fff;
                text-decoration: none;
                cursor: pointer;
                transition: all 0.3s ease;
                background: linear-gradient(135deg, #6a11cb, #2575fc);
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            /* 链接按钮悬停效果 */
            .ai-link:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            }

            /* 链接按钮点击效果 */
            .ai-link:active {
                transform: translateY(0);
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            /* 编辑器工具条：字数统计/自动保存状态/内容自查 */
            .editor_tipbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: 93%;
                margin: 6px auto 0;
                font-size: 12px;
                color: #7d8a83;
            }

            .editor_tipbar .word_stat b { color: #2c8a61; font-weight: 600 }
            .editor_tipbar .autosave_stat { margin-left: 14px }

            .btn_check {
                display: inline-block;
                padding: 6px 14px;
                border-radius: 6px;
                border: 1px solid #4a90d9;
                color: #4a90d9;
                background: #fff;
                font-size: 12px;
                cursor: pointer;
                vertical-align: middle;
            }

            .btn_check:hover { background: #eef4fd }

            /* 发布方式选项 */
            .publish_opt label { margin-right: 16px; font-size: 13px; color: #5c6b64; cursor: pointer }
            .publish_time_input { display: none; width: 170px; height: 28px; padding: 0 8px; border: 1px solid #e6e6e6; border-radius: 4px; font-size: 12px }

            /* 自查结果弹层 */
            .check_result { padding: 16px 20px; font-size: 13px; line-height: 1.9; color: #5c6b64 }
            .check_result h4 { font-size: 13px; color: #333; margin-top: 10px }
            .check_result .chk_bad { color: #e05a5a }
            .check_result .chk_tip { color: #e6a23c }
            .check_result .chk_ok { color: #2c8a61 }
            .check_result .word_tag { display: inline-block; margin: 2px 6px 2px 0; padding: 2px 8px; background: #fef0f0; color: #e05a5a; border-radius: 4px; font-size: 12px }

            /* 不同按钮的颜色 */
            .ai-link.expand {
                background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            }

            .ai-link.condense {
                background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            }

            .ai-link.continue {
                background: linear-gradient(135deg, #f6d365, #fda085);
            }

            .ai-link.polish {
                background: linear-gradient(135deg, #ff6f61, #ffcc00);
            }
        </style>
    </head>
</head>
<body class="author_zone">

<div th:replace="author/common/header :: header"></div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="author/common/menu :: menu('book')"></div>
        <div class="my_r">
            <div class="my_bookshelf">

                <div class="userBox cf">
                    <form method="post" action="./register.html" id="form2">
                        <div class="user_l">
                            <div></div>
                            <h3>小说章节内容填写</h3>
                            <ul class="log_list">
                                <li><span id="LabErr"></span></li>
                                <b>章节名：</b>
                                <li><input type="text" id="bookIndex" name="bookIndex" class="s_input"></li>
                                <b>章节内容：</b>
                                <li id="contentLi" style="width: 500px">
                                    <div class="editor-container">
                                        <div class="ai-toolbar">
                                            <a class="ai-link expand" data-type="stream/expand">AI扩写</a>
                                            <a class="ai-link condense" data-type="stream/condense">AI缩写</a>
                                            <a class="ai-link continue" data-type="stream/continue">AI续写</a>
                                            <a class="ai-link polish" data-type="stream/polish">AI润色</a>
                                        </div>
                                        <textarea id="bookContent" name="bookContent"
                                                  placeholder="请输入文本内容..."></textarea>
                                        <div class="editor_tipbar">
                                            <span class="word_stat">字数：<b id="wordStat">0</b><span class="autosave_stat" id="autosaveStat"></span></span>
                                            <button type="button" class="btn_check" onclick="checkContent()">内容自查</button>
                                        </div>
                                    </div>

                                    <b>是否收费：</b>
                                <li><input type="radio" name="isVip" value="0" checked>免费
                                    <input type="radio" name="isVip" value="1">收费
                                </li>

                                <b>发布方式：</b>
                                <li class="publish_opt">
                                    <label><input type="radio" name="publishStatus" value="1" checked>立即发布</label>
                                    <label><input type="radio" name="publishStatus" value="0">存草稿</label>
                                    <label><input type="radio" name="publishStatus" value="2">定时发布</label>
                                    <input type="text" id="publishTime" class="publish_time_input" placeholder="yyyy-MM-dd HH:mm" readonly/>
                                </li>


                                <li style="margin-top: 10px"><input type="button" onclick="addBookContent()"
                                                                    name="btnRegister" value="提交"
                                                                    id="btnRegister" class="btn_red">


                                </li>
                            </ul>
                        </div>
                    </form>
                </div>

                </div>-->
            </div>
        </div>
    </div>
</div>


</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script src="/javascript/common.js" type="text/javascript"></script>

<script language="javascript" type="text/javascript">


    var lock = false;

    var bookId = getSearchString("bookId");

    //localStorage 草稿键：按书隔离，提交成功后清除
    var draftKey = 'author_chapter_draft_add_' + bookId;

    function addBookContent() {

        if (lock) {
            return;
        }
        lock = true;


        var indexName = $("#bookIndex").val();
        if (!indexName) {
            $("#LabErr").html("章节名不能为空！");
            lock = false;
            return;
        }

        var content = $("#bookContent").val();
        if (!content) {
            $("#LabErr").html("章节内容不能为空！");
            lock = false;
            return;
        }


        var isVip = $("input:checked[name=isVip]").val();
        var publishStatus = $("input:checked[name=publishStatus]").val();
        var publishTime = $.trim($("#publishTime").val());
        if (publishStatus == 2 && !publishTime) {
            $("#LabErr").html("请选择定时发布的时刻！");
            lock = false;
            return;
        }

        $.ajax({
            type: "POST",
            url: "/author/addBookContent",
            data: {'bookId': bookId, 'indexName': indexName, 'content': content, 'isVip': isVip,
                'publishStatus': publishStatus, 'publishTime': publishTime ? publishTime : ''},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {

                    //提交成功，清除本地草稿，避免下次误恢复旧稿
                    clearLocalDraft();
                    window.location.href = '/author/index_list.html?bookId=' + bookId;


                } else {
                    lock = false;
                    $("#LabErr").html(data.msg);
                }

            },
            error: function () {
                lock = false;
                layer.alert('网络异常');
            }
        })

    }

    // ---------- 自动保存草稿（localStorage 防丢稿） ----------
    var saveTimer = null;

    function updateWordStat() {
        var len = $("#bookContent").val().replace(/\s/g, '').length;
        $("#wordStat").text(len);
    }

    function clearLocalDraft() {
        try {
            localStorage.removeItem(draftKey);
        } catch (e) {
        }
    }

    function saveLocalDraft() {
        var content = $("#bookContent").val();
        if (!content) {
            return;
        }
        try {
            localStorage.setItem(draftKey, JSON.stringify({
                'indexName': $("#bookIndex").val(),
                'content': content,
                'isVip': $("input:checked[name=isVip]").val(),
                'saveTime': new Date().toLocaleTimeString()
            }));
            $("#autosaveStat").text('已自动保存');
        } catch (e) {
            //隐私模式/容量超限，不影响正常填写
            $("#autosaveStat").text('自动保存不可用');
        }
    }

    function restoreLocalDraft() {
        var raw = null;
        try {
            raw = localStorage.getItem(draftKey);
        } catch (e) {
        }
        if (!raw) {
            return;
        }
        var draft;
        try {
            draft = JSON.parse(raw);
        } catch (e) {
            clearLocalDraft();
            return;
        }
        if (!draft || !draft.content) {
            return;
        }
        layer.confirm('检测到本地未提交的草稿（保存于 ' + (draft.saveTime || '未知时间') + '），是否恢复？', {
            btn: ['恢复', '丢弃']
        }, function (index) {
            layer.close(index);
            $("#bookIndex").val(draft.indexName || '');
            $("#bookContent").val(draft.content);
            if (draft.isVip != null) {
                $("input[name=isVip][value='" + draft.isVip + "']").prop('checked', true);
            }
            updateWordStat();
            $("#autosaveStat").text('已恢复本地草稿');
        }, function (index) {
            layer.close(index);
            clearLocalDraft();
        });
    }

    //输入停顿3秒自动保存；章节名/收费项变更也触发
    $("#bookContent,#bookIndex").on('input keyup change', function () {
        updateWordStat();
        $("#autosaveStat").text('编辑中…');
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveLocalDraft, 3000);
    });

    //离开页面前仍有未存内容时补一次保存（提交成功路径已提前清除）
    window.onbeforeunload = function () {
        if ($("#bookContent").val() && !lock) {
            saveLocalDraft();
        }
    };

    restoreLocalDraft();
    updateWordStat();

    // ---------- 发布方式：选定时发布才展示时间控件 ----------
    // laydate 2.4.5 兼容写法：min 传时间戳（原生支持，自动识别秒/毫秒；传 Date 对象会导致日期全被禁用），
    // 且默认 trigger 为 focus，readonly 输入框点不出面板，需显式指定 click
    layui.use('laydate', function () {
        var laydate = layui.laydate;
        laydate.render({
            elem: '#publishTime',
            type: 'datetime',
            trigger: 'click',
            format: 'yyyy-MM-dd HH:mm',
            min: Date.now()
        });
    });

    $("input[name=publishStatus]").on('change', function () {
        if ($(this).val() == 2) {
            $("#publishTime").show();
        } else {
            $("#publishTime").hide().val('');
        }
    });

    // ---------- 内容自查：敏感词/段落格式/有效字数（发布前预检，不拦截） ----------
    function checkContent() {
        var content = $("#bookContent").val();
        if (!content) {
            layer.msg('请先输入章节内容');
            return;
        }
        var loading = layer.load(1, {shade: 0.3});
        $.ajax({
            type: "POST",
            url: "/author/checkChapterContent",
            data: {'content': content},
            dataType: "json",
            success: function (data) {
                layer.close(loading);
                if (data.code == 200) {
                    showCheckResult(data.data);
                } else if (data.code == 1001) {
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
                } else {
                    layer.alert(data.msg);
                }
            },
            error: function () {
                layer.close(loading);
                layer.alert('网络异常');
            }
        });
    }

    function showCheckResult(r) {
        var html = '<p>有效字数：<b class="chk_ok">' + (r.wordCount || 0) + '</b> 字</p>';
        if (r.problems && r.problems.length > 0) {
            html += '<h4>需要修正的问题</h4>';
            for (var i = 0; i < r.problems.length; i++) {
                html += '<p class="chk_bad">· ' + r.problems[i] + '</p>';
            }
        }
        if (r.sensitiveWords && r.sensitiveWords.length > 0) {
            html += '<h4>命中敏感词（建议修改后发布）</h4><p>';
            for (var j = 0; j < r.sensitiveWords.length; j++) {
                html += '<span class="word_tag">' + r.sensitiveWords[j] + '</span>';
            }
            html += '</p>';
        }
        if (r.tips && r.tips.length > 0) {
            html += '<h4>格式建议</h4>';
            for (var k = 0; k < r.tips.length; k++) {
                html += '<p class="chk_tip">· ' + r.tips[k] + '</p>';
            }
        }
        if ((!r.problems || r.problems.length == 0) && (!r.sensitiveWords || r.sensitiveWords.length == 0) && (!r.tips || r.tips.length == 0)) {
            html += '<p class="chk_ok">未发现明显问题，可以安心发布～</p>';
        }
        layer.open({
            type: 1,
            title: '内容自查结果',
            area: ['540px', '440px'],
            content: '<div class="check_result">' + html + '</div>'
        });
    }


    // 打字机效果函数
    function typeWriter(textarea, text, speed = 50) {
        let i = 0;
        const timer = setInterval(() => {
            if (i < text.length) {
                textarea.val(textarea.val() + text.charAt(i));
                i++;
                // 滚动到底部
                textarea.scrollTop(textarea[0].scrollHeight);
            } else {
                clearInterval(timer);
            }
        }, speed);
    }

    $('.ai-toolbar .ai-link').click(function (e) {
        e.preventDefault(); // 阻止默认链接行为
        const type = $(this).data('type');
        const textarea = $('#bookContent');
        const selectedText = textarea.val().substring(textarea[0].selectionStart, textarea[0].selectionEnd);

        // 检查是否选中文本
        if (!selectedText) {
            layer.msg('请先选中要处理的文本');
            return;
        }

        const loading = layer.load(1, {shade: 0.3});

        // 参数配置
        let params = {text: selectedText};
        if (type === 'stream/expand' || type === 'stream/condense') {
            layer.prompt({
                title: '请输入比例',
                value: 2,
                btn: ['确定', '取消'],
                btn2: function () {
                    layer.close(loading);
                },
                cancel: function () {
                    layer.close(loading);
                }
            }, function (value, index) {
                if (isNaN(Number(value)) || isNaN(parseFloat(value))) {
                    layer.msg('请输入正确的比例');
                    return;
                }
                if (type === 'stream/expand' && value <= 1) {
                    layer.msg('请输入正确的比例');
                    return;
                }
                if (type === 'stream/condense' && (value <= 0 || value >= 1)) {
                    layer.msg('请输入正确的比例');
                    return;
                }
                params.ratio = parseFloat(value) * 100;
                layer.close(index);
                sendRequest(type, params, loading, textarea);
            });
            return;
        } else if (type === 'stream/continue') {
            layer.prompt({
                title: '请输入续写长度（字数）',
                value: 200,
                btn: ['确定', '取消'],
                btn2: function () {
                    layer.close(loading);
                },
                cancel: function () {
                    layer.close(loading);
                }
            }, function (value, index) {
                if (!Number.isInteger(Number(value)) || value <= 0) {
                    layer.msg('请输入正确的长度');
                    return;
                }
                params.length = parseInt(value);
                layer.close(index);
                sendRequest(type, params, loading, textarea);
            });
            return;
        }

        sendRequest(type, params, loading, textarea);
    });

    function sendRequest(type, params, loading, textarea) {
        const url = `/author/ai/${type}?text=${encodeURIComponent(params.text)}&ratio=${params.ratio}&length=${params.length}`;
        const eventSource = new EventSource(url);

        // 监听消息事件
        eventSource.onmessage = function (event) {
            layer.close(loading);
            const data = event.data;
            console.log('Received data:', data);

            textarea.val(textarea.val() + data);
            // 滚动到底部
            textarea.scrollTop(textarea[0].scrollHeight);
        };

        // 监听错误事件
        eventSource.onerror = function (error) {
            layer.close(loading);
            console.error('EventSource failed:', error);
            eventSource.close(); // 关闭连接
        };

    }

</script>
</html>
