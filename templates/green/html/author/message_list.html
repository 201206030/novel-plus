<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
        <title>消息中心-作家管理系统</title>
        <link rel="stylesheet" href="/css/base.css?v=1"/>
        <link rel="stylesheet" href="/css/user.css"/>
        <link rel="stylesheet" href="/css/author.css"/>
        <style type="text/css">
            /* 未读圆点 */
            .author_zone .msg_dot { display:inline-block; width:8px; height:8px; border-radius:50%;
                background:#f56c6c; margin-right:6px; vertical-align:middle }
            .author_zone .msg_ops a { margin-right:10px; font-size:12px; color:#3eaf7c; cursor:pointer }
            .author_zone .msg_ops a:hover { text-decoration:underline }
            .author_zone .msg_empty { padding:50px 0; text-align:center; color:#98a8a1; font-size:14px }
            .author_zone .msg_bar { padding:14px 0 0 }
            .author_zone .read_all_btn { display:inline-block; padding:5px 16px; border:1px solid #3eaf7c;
                border-radius:16px; background:rgba(62,175,124,.08); color:#2c8a61; font-size:12px; cursor:pointer }
            .author_zone .read_all_btn:hover { background:rgba(62,175,124,.16) }
            .author_zone .updateTable tr.msg_row { cursor:pointer }
            .author_zone .updateTable tr.msg_row:hover td { background:#f7fbf9 }
            .author_zone .updateTable tr.msg_row.msg_unread:hover td { background:#f2faf6 }
        </style>
    </head>
</head>
<body class="author_zone">

<div th:replace="author/common/header :: header"></div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="author/common/menu :: menu('msg')"></div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div class="title cf">
                    <h2 class="fl ml10">消息中心</h2>
                    <span class="fr msg_bar"><a class="read_all_btn" onclick="readAll()">全部标为已读</a></span>
                </div>

                <div id="divData" class="updateTable">
                    <table cellpadding="0" cellspacing="0">
                        <thead>
                        <tr>
                            <th class="goread">消息内容</th>
                            <th class="goread" style="width:96px;">发送人</th>
                            <th class="goread" style="width:104px;">时间</th>
                            <th class="goread" style="width:72px;">操作</th>
                        </tr>
                        </thead>
                        <tbody id="msgList">
                        </tbody>
                    </table>
                    <div class="pageBox cf" id="shellPage">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script src="/javascript/common.js" type="text/javascript"></script>

<script language="javascript" type="text/javascript">
    // 不分类、不过滤：直接展示所有类型的消息
    search(1, 10);

    function search(curr, limit) {
        $.ajax({
            type: 'get',
            url: '/user/message/listByPage',
            data: {'curr': curr, 'limit': limit},
            dataType: 'json',
            success: function (data) {
                if (data.code == 200) {
                    renderMsgList(data.data);
                } else if (data.code == 1001) {
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
                } else {
                    layer.alert(data.msg);
                }
            },
            error: function () {
                layer.alert('网络异常');
            }
        });
    }

    function renderMsgList(pageBean) {
        var list = pageBean.list;
        if (!list || list.length == 0) {
            $("#msgList").html('<tr><td colspan="4"><div class="msg_empty">暂时没有新消息~</div></td></tr>');
            $("#shellPage").html('');
            return;
        }
        var html = '';
        for (var i = 0; i < list.length; i++) {
            html += buildMsgRow(list[i]);
        }
        $("#msgList").html(html);

        layui.use('laypage', function () {
            var laypage = layui.laypage;
            laypage.render({
                elem: 'shellPage'
                , count: pageBean.total
                , curr: pageBean.pageNum
                , limit: pageBean.pageSize
                , theme: '#3eaf7c'
                , jump: function (obj, first) {
                    if (!first) {
                        search(obj.curr, obj.limit);
                    }
                }
            });
        });
    }

    function escapeHtml(str) {
        return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function buildMsgRow(msg) {
        var unread = msg.readFlag != 1;
        var dot = unread ? '<span class="msg_dot"></span>' : '';
        // msgType：1书评被回复 2段评被回复 3系统通知；书评/段评提供查看跳转，系统通知无跳转
        var ops = '';
        if (msg.msgType != 3) {
            ops += '<a onclick="openMsg(event, this)">查看</a>';
        }
        if (unread) {
            ops += '<a onclick="readOne(event, ' + msg.id + ', this)">标已读</a>';
        }
        return '<tr class="msg_row' + (unread ? ' msg_unread' : '') + '" data-id="' + msg.id + '"'
            + ' data-type="' + msg.msgType + '" data-book="' + (msg.bookId || 0) + '"'
            + ' data-index="' + (msg.bookIndexId || 0) + '" data-target="' + (msg.targetId || 0) + '"'
            + ' onclick="rowClick(this)">'
            + '<td class="msg_content">' + dot + escapeHtml(msg.content || '') + '</td>'
            + '<td class="goread">' + escapeHtml(msg.sendUserName || (msg.msgType == 3 ? '系统' : '某用户')) + '</td>'
            + '<td class="goread" style="font-size:12px;color:#98a8a1;">' + escapeHtml(msg.createTime || '') + '</td>'
            + '<td class="goread msg_ops">' + (ops || '—') + '</td>'
            + '</tr>';
    }

    // 整行点击：未读先标已读；书评/段评跳转被回复内容，系统通知只标已读
    function rowClick(tr) {
        var $tr = $(tr);
        if ($tr.hasClass('msg_unread')) {
            markRead($tr.attr('data-id'), $tr);
        }
        var type = $tr.attr('data-type');
        if (type == 3) {
            return;
        }
        location.href = type == 2
            ? '/book/' + $tr.attr('data-book') + '/' + $tr.attr('data-index') + '.html'
            : '/book/reply-' + $tr.attr('data-target') + '.html';
    }

    function openMsg(event, el) {
        event.stopPropagation();
        rowClick($(el).closest('tr'));
    }

    function readOne(event, id, el) {
        event.stopPropagation();
        markRead(id, $(el).closest('tr'));
    }

    // 标记单条已读：本地即时去高亮，服务端落库，同步刷新未读角标（只移除「标已读」，保留「查看」）
    function markRead(id, $tr) {
        $tr.removeClass('msg_unread').find('.msg_dot').remove();
        $tr.find('.msg_ops a').each(function () {
            if ($(this).text() == '标已读') {
                $(this).remove();
            }
        });
        if ($tr.find('.msg_ops a').length == 0) {
            $tr.find('.msg_ops').html('—');
        }
        $.ajax({
            type: 'post',
            url: '/user/message/read',
            data: {'messageId': id},
            dataType: 'json',
            success: function (data) {
                if (data.code == 200 && window.AuthHeader) {
                    window.AuthHeader.refreshMsgBadge();
                }
            }
        });
    }

    // 全部已读：当前列表整体置已读并刷新角标
    function readAll() {
        $.ajax({
            type: 'post',
            url: '/user/message/readAll',
            data: {},
            dataType: 'json',
            success: function (data) {
                if (data.code == 200) {
                    $('tr.msg_unread').removeClass('msg_unread').find('.msg_dot').remove();
                    $('.msg_ops a').each(function () {
                        if ($(this).text() == '标已读') {
                            $(this).remove();
                        }
                    });
                    $('.msg_ops').each(function () {
                        if ($(this).find('a').length == 0) {
                            $(this).html('—');
                        }
                    });
                    if (window.AuthHeader) {
                        window.AuthHeader.refreshMsgBadge();
                    }
                    layer.msg('已全部标为已读');
                } else {
                    layer.alert(data.msg);
                }
            },
            error: function () {
                layer.alert('网络异常');
            }
        });
    }
</script>
</html>
