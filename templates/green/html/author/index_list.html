<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
        <title>作家管理系统-小说精品屋</title>
        <link rel="stylesheet" href="/css/base.css?v=1"/>
        <link rel="stylesheet" href="/css/user.css"/>
        <link rel="stylesheet" href="/css/author.css"/>
    </head>
</head>
<body class="author_zone">

<div th:replace="author/common/header :: header"></div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="author/common/menu :: menu('book')"></div>
        <div class="my_r">
            <div class="book_brief cf" id="bookBrief">
                <a href="/author/index.html" class="back_link">← 返回小说列表</a>
                <img id="briefCover" src="" alt="封面"/>
                <h3 id="briefName"></h3>
                <p id="briefSub"></p>
            </div>
            <div id="noContentDiv">
                <div class="empty_box">
                    <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#3eaf7c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 4h9a2 2 0 0 1 2 2v13l-3-2-3 2-3-2-3 2V6a2 2 0 0 1 2-2z"/>
                        <path d="M9.5 9h6M9.5 12.5h4"/>
                    </svg>
                    <p>还没有章节，从第一章开始创作吧～</p>
                    <a href="javascript:addContent()" class="btn_main">新建章节</a>
                </div>
            </div>
            <div class="my_bookshelf" id="hasContentDiv" style="display: none">
                <div class="title cf">
                    <h2 class="fl">章节列表<span class="sub" id="indexTotal"></span></h2>
                    <div class="fr"><a href="javascript:addContent()" class="btn_main">＋ 新建章节</a></div>
                </div>

                <div id="divData" class="updateTable">
                    <table cellpadding="0" cellspacing="0">
                        <thead>
                        <tr>
                            <th class="name">
                                章节名
                            </th>
                            <th class="goread col_time">
                                更新时间
                            </th>
                            <th class="goread col_status">
                                发布状态
                            </th>
                            <th class="goread col_vip">
                                是否收费
                            </th>
                            <th class="goread col_opt">
                                操作
                            </th>
                        </tr>
                        </thead>
                        <tbody id="bookList">


                        </tbody>
                    </table>
                    <div class="pageBox cf" id="shellPage">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script src="/javascript/date.js" type="text/javascript"></script>
<script src="/javascript/common.js" type="text/javascript"></script>

<script language="javascript" type="text/javascript">

    var bookId = getSearchString("bookId");

    var indexCount = 0;

    //HTML转义，防止章节名破坏表格结构
    function escapeHtml(str) {
        return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    //时间单行完整展示（不再拆成日期/时刻两行）
    function fmtTime(t) {
        var d = new Date(Date.parse(t));
        return d.Format('yyyy-MM-dd hh:mm');
    }

    //加载顶部作品信息栏
    function loadBookBrief() {
        if (!bookId) {
            return;
        }
        $.ajax({
            type: "get",
            url: "/book/queryBookDetail/" + bookId,
            data: {},
            dataType: "json",
            success: function (data) {
                if (data.code == 200 && data.data) {
                    var book = data.data;
                    $("#briefCover").attr("src", book.picUrl);
                    $("#briefName").text(book.bookName);
                    var sub = (book.catName ? book.catName + ' · ' : '')
                        + (book.bookStatus == 0 ? '连载中' : '已完结')
                        + ' · 已发布 ' + (data.data.wordCount || 0) + ' 字';
                    $("#briefSub").text(sub);
                    $("#bookBrief").show();
                }
            }
        });
    }

    loadBookBrief();

    search(1, 20);

    function search(curr, limit) {

        $.ajax({
            type: "get",
            url: "/author/listIndexByPage",
            data: {'bookId': bookId, 'curr': curr, 'limit': limit},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var bookList = data.data.list;
                    if (bookList.length > 0) {
                        indexCount = data.data.total;
                        $("#indexTotal").text('共 ' + data.data.total + ' 章');
                        $("#hasContentDiv").css("display", "block");
                        $("#noContentDiv").css("display", "none");
                        var bookListHtml = "";
                        for (var i = 0; i < bookList.length; i++) {
                            var book = bookList[i];
                            bookListHtml += '<tr class="book_list">'
                                + '<td class="name" id="name' + book.id + '" title="' + escapeHtml(book.indexName) + '">' + escapeHtml(book.indexName) + '</td>'
                                + '<td class="goread time_cell">' + fmtTime(book.updateTime) + '</td>'
                                + '<td class="goread status_cell">' + statusTag(book) + '</td>'
                                + '<td class="goread">' + (book.isVip == 1 ? '<span class="tag tag_vip">收费</span>' : '<span class="tag tag_free">免费</span>') + '</td>'
                                + '<td class="goread opt" id="opt' + book.id + '">'
                                + '<a href="javascript:updateIndex(\'' + book.id + '\',' + book.isVip + ')">修改</a>';
                            //草稿/定时章节提供发布入口；已发布章节不回退，不提供定时入口
                            if (book.status == 0 || book.status == 2) {
                                bookListHtml += '<a href="javascript:publishIndex(\'' + book.id + '\')">立即发布</a>';
                            }
                            if (book.status == 0) {
                                bookListHtml += '<a href="javascript:scheduleIndex(\'' + book.id + '\')">定时发布</a>';
                            }
                            bookListHtml += '<a class="opt_del" href="javascript:deleteIndex(\'' + book.id + '\')">删除</a>'
                                + '</td></tr>';
                        }
                        $("#bookList").html(bookListHtml);

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            //执行一个laypage实例
                            laypage.render({
                                elem: 'shellPage' //注意，这里的 test1 是 ID，不用加 # 号
                                , count: data.data.total //数据总数，从服务端得到
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , theme: '#3eaf7c'
                                , jump: function (obj, first) {
                                    //首次不执行
                                    if (!first) {
                                        search(obj.curr, obj.limit);
                                    }
                                }
                            });
                        });

                    }


                } else if (data.code == 1001) {
                    //未登录
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })

    }

    //发布状态徽章：草稿暖橙 / 定时蓝（附发布时刻） / 已发布绿
    function statusTag(book) {
        if (book.status == 0) {
            return '<span class="tag tag_draft">草稿</span>';
        } else if (book.status == 2) {
            var plan = book.publishTime ? fmtTime(book.publishTime) : '';
            return '<span class="tag tag_schedule" title="' + plan + '">定时 ' + plan + '</span>';
        }
        return '<span class="tag tag_online">已发布</span>';
    }

    //立即发布草稿/定时章节
    function publishIndex(indexId) {
        layer.confirm('确认立即发布该章节吗？发布后读者即可阅读。', {
            btn: ['确定', '取消']
        }, function (index) {
            layer.close(index);
            $.ajax({
                type: "post",
                url: "/author/publishIndex/" + indexId,
                data: {},
                dataType: "json",
                success: function (data) {
                    if (data.code == 200) {
                        layer.msg('发布成功');
                        search(1, 20);
                        loadBookBrief();
                    } else if (data.code == 1001) {
                        location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
                    } else {
                        layer.alert(data.msg);
                    }
                },
                error: function () {
                    layer.alert('网络异常');
                }
            });
        });
    }

    //草稿章节设为定时发布：层内选发布时刻
    function scheduleIndex(indexId) {
        layui.use('laydate', function () {
            var laydate = layui.laydate;
            layer.open({
                type: 1,
                title: '定时发布',
                area: ['380px', '210px'],
                content: '<div style="padding:26px 24px;font-size:13px;color:#5c6b64">发布时刻'
                    + '<input type="text" id="scheduleTimeInput" class="publish_time_input" style="display:inline-block;width:190px;margin-left:10px" placeholder="yyyy-MM-dd HH:mm" readonly/>'
                    + '<p style="margin-top:14px;font-size:12px;color:#99a59e">到时自动发布，发布前读者不可见</p></div>',
                btn: ['确定', '取消'],
                success: function () {
                    $("#scheduleTimeInput").val('');
                    // laydate 2.4.5 兼容：min 传时间戳（传 Date 对象会因无 .match 方法报错导致面板崩溃），readonly 输入框需 click 触发
                    laydate.render({
                        elem: '#scheduleTimeInput',
                        type: 'datetime',
                        trigger: 'click',
                        format: 'yyyy-MM-dd HH:mm',
                        min: Date.now()
                    });
                },
                yes: function (index) {
                    var publishTime = $.trim($("#scheduleTimeInput").val());
                    if (!publishTime) {
                        layer.msg('请选择发布时刻');
                        return;
                    }
                    $.ajax({
                        type: "post",
                        url: "/author/scheduleIndex",
                        data: {'indexId': indexId, 'publishTime': publishTime},
                        dataType: "json",
                        success: function (data) {
                            if (data.code == 200) {
                                layer.close(index);
                                layer.msg('已设为定时发布');
                                search(1, 20);
                            } else if (data.code == 1001) {
                                location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
                            } else {
                                layer.alert(data.msg);
                            }
                        },
                        error: function () {
                            layer.alert('网络异常');
                        }
                    });
                }
            });
        });
    }

    function addContent() {
        location.href = "/author/content_add.html?indexCount=" + indexCount + "&bookId=" + bookId;

    }

    function updateIndex(indexId, isVip) {

        var indexName = $.trim($("#name" + indexId).text());


        location.href = "/author/content_update.html?bookId=" + bookId
            + "&indexId=" + indexId
            + "&indexName=" + encodeURI(encodeURI(indexName))
            + "&isVip=" + isVip;

    }


    function deleteIndex(indexId) {

        layer.confirm('确认要删除吗？删除后数据无法找回！', {
            btn: ['确定', '取消']//按钮
        }, function (index) {

            layer.close(index);
            $.ajax({
                type: "delete",
                url: "/author/deleteIndex/" + indexId,
                data: {},
                dataType: "json",
                success: function (data) {
                    if (data.code == 200) {

                        location.reload();


                    } else if (data.code == 1001) {
                        //未登录
                        location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                    } else {
                        layer.alert(data.msg);
                    }

                },
                error: function () {
                    layer.alert('网络异常');
                }
            })
        });


    }
</script>
</html>
