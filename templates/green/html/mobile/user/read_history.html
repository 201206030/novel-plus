<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title th:text="${application.website.name}+'列表'"></title>

    <meta name="keywords"
          th:content="${application.website.name}+',精品小说,弹幕网站,弹幕,弹幕小说网站,免费小说,小说阅读,小说排行,轻小说,txt小说下载,电子书下载,动漫轻小说,日本轻小说'">

    <meta name="description"
          th:content="${application.website.name}+'是国内优秀的小说弹幕网站,'+${application.website.name}+'提供海量热门网络小说,日本轻小说,国产轻小说,动漫小说,轻小说在线阅读和TXT小说下载,致力于网络精品小说的收集,智能计算小说评分,打造小说精品排行榜,致力于无广告无弹窗的小说阅读环境。'">


    <div th:include="mobile/common/css :: css"></div>

    <style type="text/css">
        body {
            background: #f5f7f6;
        }

        #bookList {
            padding-top: 10px;
        }

        div, p {
            wrap-work: break-word;
            word-break: break-all;
            word-wrap: break-word;
            word-break: normal;
            box-sizing: border-box;
        }

        /* 历史书卡片：整卡一个链接 */
        .history-item {
            display: -webkit-flex;
            display: flex;
            margin: 0 12px 10px;
            padding: 12px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(62, 175, 124, .08);
            -webkit-tap-highlight-color: transparent;
            color: #1f2d26;
        }

        .history-item:active {
            opacity: .88;
        }

        .history-item .cover {
            -webkit-flex: 0 0 auto;
            flex: 0 0 auto;
            width: 64px;
            height: 88px;
            border-radius: 4px;
            object-fit: cover;
            background: #f0f2f1;
        }

        .history-item .info {
            -webkit-flex: 1;
            flex: 1;
            min-width: 0;
            margin-left: 10px;
        }

        .history-item .book-name {
            font-size: 15px;
            font-weight: 600;
            color: #1f2d26;
            line-height: 22px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item .meta-row {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            margin-top: 6px;
        }

        .history-item .tag-pill {
            font-size: 10px;
            line-height: 16px;
            padding: 0 7px;
            border-radius: 8px;
            background: rgba(62, 175, 124, .12);
            color: #2e8b62;
            margin-right: 6px;
        }

        .history-item .tag-pill.gray {
            background: #f0f2f1;
            color: #8a968f;
        }

        .history-item .update-time {
            margin-left: auto;
            font-size: 11px;
            color: #98a8a1;
        }

        .history-item .author {
            margin-top: 5px;
            font-size: 12px;
            color: #8a968f;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item .desc {
            margin-top: 5px;
            font-size: 12px;
            color: #98a8a1;
            line-height: 17px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 空记录 */
        .empty-tip {
            text-align: center;
            color: #98a8a1;
            font-size: 14px;
            line-height: 24px;
            padding: 60px 20px;
        }

        .empty-tip .empty-link {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 20px;
            background: rgba(62, 175, 124, .1);
            color: #2e8b62;
            font-size: 13px;
            border-radius: 16px;
        }

        /* 分页 */
        .page-box {
            text-align: center;
            padding: 6px 12px 16px;
        }
    </style>
</head>
<body>


<input type="hidden" id="limit" th:value="${limit}"/>
<input type="hidden" id="curr" th:value="${curr}"/>
<input type="hidden" id="total" th:value="${total}"/>
<input type="hidden" id="ids" th:value="${ids}"/>
<input type="hidden" id="bookStatus" th:value="${bookStatus}"/>
<input type="hidden" id="token" th:value="${token}"/>
<input type="hidden" id="keyword" th:value="${keyword}"/>
<input type="hidden" id="catId" th:value="${catId}"/>
<input type="hidden" id="sortBy" th:value="${sortBy}"/>
<input type="hidden" id="sort" th:value="${sort}"/>

<div th:replace="mobile/common/header :: pageHeader('阅读历史', null)"></div>
<div id="body">
    <div id="bookList">


    </div>


    <div id="books" class="page-box"></div>

</div>
<div th:replace="mobile/common/footer :: footer">
</div>

<a name="buttom"></a>
</body>

<div th:replace="mobile/common/js :: js"></div>

<script>

    search(1, 20);

    function search(curr, limit) {


        $.ajax({
            type: "get",
            url: "/user/listReadHistoryByPage",
            data: {'curr': curr, 'limit': limit},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var bookList = data.data.list;
                    var bookListHtml = "";
                    for (var i = 0; i < bookList.length; i++) {
                        var book = bookList[i];

                        /*var end = book.bookDesc.indexOf("<");
                        if(end != -1) {
                            book.bookDesc = book.bookDesc.substring(0,end);
                        }*/

                        if (book.bookDesc) {
                            book.bookDesc = book.bookDesc.replace(/<[^>]+>/g, "").replace(/\s+/g, "").replace(/&nbsp;/g, "");
                        }

                        bookListHtml += ("<a class=\"history-item\" href='/book/" + book.bookId + "/" + book.preContentId + ".html'>\n" +
                            "    <img class=\"cover\" src=\"" + book.picUrl + "\"/>\n" +
                            "    <div class=\"info\">\n" +
                            "        <div class=\"book-name\">" + book.bookName + "</div>\n" +
                            "        <div class=\"meta-row\">\n" +
                            "            <span class=\"tag-pill\">" + book.catName + "</span>\n" +
                            "            <span class=\"tag-pill gray\">" + (book.bookStatus == 0 ? '连载' : '完结') + "</span>\n" +
                            "            <span class=\"update-time\">" + book.lastIndexUpdateTime.substr(0, 11) + " 更新</span>\n" +
                            "        </div>\n" +
                            "        <div class=\"author\">作者：" + book.authorName + "</div>\n" +
                            "        <div class=\"desc\">简介：" + (book.bookDesc ? book.bookDesc : '暂无简介') + "</div>\n" +
                            "    </div>\n" +
                            "</a>");
                    }
                    $("#bookList").html(bookListHtml || "<div class=\"empty-tip\">还没有阅读记录，去书城发现好书吧~<br><a href=\"/\" class=\"empty-link\">去书城逛逛</a></div>");

                    layui.use('laypage', function () {
                        var laypage = layui.laypage;

                        //执行一个laypage实例
                        laypage.render({
                            elem: 'books' //注意，这里的 test1 是 ID，不用加 # 号
                            , count: data.data.total //数据总数，从服务端得到,
                            , curr: data.data.pageNum
                            , limit: data.data.pageSize
                            , jump: function (obj, first) {


                                //obj包含了当前分页的所有参数，比如：
                                console.log(obj.curr); //得到当前页，以便向服务端请求对应页的数据。
                                console.log(obj.limit); //得到每页显示的条数


                                //首次不执行
                                if (!first) {
                                    search(obj.curr, obj.limit);
                                } else {

                                }
                            }
                        });
                    });
                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })

    }


    function searchByAllCondition(curr, limit, newKeyword) {
        var toUrl = "/book/search?curr=" + curr + "&limit=" + limit;
        var ids = $("#ids").val();
        if (ids) {
            toUrl += ("&historyBookIds=" + ids);
        }
        var token = $("#token").val();
        if (token) {
            toUrl += ("&token=" + token);
        }
        var keyword = $("#keyword").val();
        if (newKeyword) {
            toUrl += encodeURI("&keyword=" + newKeyword);
        } else if (keyword) {
            toUrl += encodeURI("&keyword=" + keyword);
        }
        var bookStatus = $("#bookStatus").val();
        if (bookStatus) {
            toUrl += ("&bookStatus=" + bookStatus);
        }
        var catId = $("#catId").val();
        if (catId) {
            toUrl += ("&catId=" + catId);
        }

        var sortBy = $("#sortBy").val();
        if (sortBy) {
            toUrl += ("&sortBy=" + sortBy);
        }

        var sort = $("#sort").val();
        if (sort) {
            toUrl += ("&sort=" + sort);
        }

        window.location.href = toUrl;
    }

    function searchBooks() {
        var keywords = $("#title").val();
        $("#keyword").val("");
        searchByAllCondition(1, 20, keywords);
    }

</script>
<script>


    function toMyCollect() {
        var token = localStorage.getItem("token");
        if (token) {
            window.location.href = "/book/search?token=" + token;
        } else {
            window.location.href = "/user/login.html";
        }
    }
</script>


</html>
