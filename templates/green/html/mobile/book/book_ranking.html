<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title th:text="'小说排行榜_'+${application.website.name}"></title>

    <meta name="keywords"
          content="小说排行榜,热门小说榜,小说排行榜完结版,完结小说排行榜,完本小说排行榜,最新小说排行榜,网络小说排行榜,排行榜,点击榜,新书榜,推荐榜"/>

    <meta name="description"
          th:content="'最新热门网络小说排行榜,包含各类热门小说榜,小说排行榜上都是受用户喜爱的小说作品,精彩尽在'+${application.website.name}+'。'">

    <div th:include="mobile/common/css :: css"></div>

    <style type="text/css">

        .line-limit-length {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 榜单类型选项卡 */
        .rank-tabs {
            display: flex;
            background: #fff;
            border-bottom: 1px solid #eee;
        }

        .rank-tabs a {
            flex: 1;
            text-align: center;
            line-height: 44px;
            font-size: 15px;
            color: #666;
            position: relative;
        }

        .rank-tabs a.on {
            color: #3eaf7c;
            font-weight: bold;
        }

        .rank-tabs a.on:after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: #3eaf7c;
            border-radius: 2px;
        }

        /* 榜单当前名称 */
        .rank-title {
            padding: 12px 5px 6px 5px;
            font-size: 16px;
            color: #000;
            font-weight: bold;
        }

        /* 榜单条目 */
        .rank-item {
            padding: 10px 5px;
            border-bottom: 1px solid #f2f2f2;
            background: #fff;
        }

        .rank-item .rank-name {
            color: #000;
            font-size: 15px;
        }

        .rank-item .rank-word {
            float: right;
            color: #a6a6a6;
            font-size: 12px;
            line-height: 24px;
        }

        .rank-item .rank-meta {
            margin-top: 6px;
            color: #a6a6a6;
            font-size: 13px;
        }

        .rank-item .rank-meta .rank-chapter {
            margin-top: 4px;
            display: block;
        }

        /* 排名序号 */
        .rank-num {
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            font-size: 12px;
            color: #999;
            background: #f2f2f2;
            border-radius: 3px;
            margin-right: 8px;
            vertical-align: middle;
            font-style: normal;
        }

        .rank-num-1 {
            color: #fff;
            background: #ff5722;
        }

        .rank-num-2 {
            color: #fff;
            background: #ffb800;
        }

        .rank-num-3 {
            color: #fff;
            background: #3eaf7c;
        }

    </style>
</head>
<body>


<div th:replace="mobile/common/header :: pageHeader('小说排行榜', null)"></div>

<div class="rank-tabs" id="rankType">
    <a href="javascript:listRank(0)">点击榜</a>
    <a href="javascript:listRank(1)">新书榜</a>
    <a href="javascript:listRank(2)">更新榜</a>
    <a href="javascript:listRank(3)">评论榜</a>
</div>

<div class="layui-container" style="padding: 0 5px">

    <div class="rank-title" id="rankName">点击榜</div>

    <div id="bookRankList"></div>

</div>


<div th:replace="mobile/common/footer :: footer">
</div>

<a name="buttom"></a>
</body>

<div th:replace="mobile/common/js :: js"></div>

<script type="text/javascript">

    var rankNames = ["点击榜", "新书榜", "更新榜", "评论榜"];

    // 支持通过 ?type= 直接定位榜单，与PC端参数保持一致
    var rankType = getQueryVariable("type");
    if (rankType === false || rankType === undefined || isNaN(parseInt(rankType))) {
        rankType = 0;
    } else {
        rankType = parseInt(rankType);
    }
    if (rankType < 0 || rankType >= rankNames.length) {
        rankType = 0;
    }
    listRank(rankType);

    function listRank(rankType) {
        // 选项卡高亮及榜单标题
        $("#rankType a").removeClass("on");
        $("#rankType a").eq(rankType).addClass("on");
        $("#rankName").html(rankNames[rankType]);

        $.ajax({
            type: "get",
            url: "/book/listRank",
            data: {'type': rankType, 'limit': 30},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var bookRankList = data.data;
                    var bookRankListHtml = "";
                    for (var i = 0; i < bookRankList.length; i++) {
                        var book = bookRankList[i];
                        bookRankListHtml += ("<div class=\"rank-item\">\n" +
                            "        <a href=\"/book/" + book.id + ".html\">\n" +
                            "            <i class=\"rank-num rank-num-" + (i + 1) + "\">" + (i + 1) + "</i>\n" +
                            "            <span class=\"rank-name line-limit-length\" style=\"max-width: 55%\">" + book.bookName + "</span>\n" +
                            "            <span class=\"rank-word\">" + (book.wordCount / 10000).toFixed(2) + "万字</span>\n" +
                            "        </a>\n" +
                            "        <div class=\"rank-meta\">\n" +
                            "            <a href=\"/book/bookclass.html?catId=" + book.catId + "\">[" + book.catName + "]</a> · " + book.authorName + "\n" +
                            "            <a class=\"rank-chapter line-limit-length\" href=\"/book/" + book.id + ".html\">最新章节：" + book.lastIndexName + "</a>\n" +
                            "        </div>\n" +
                            "    </div>");
                    }
                    $("#bookRankList").html(bookRankListHtml);
                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })
    }
</script>


</html>
