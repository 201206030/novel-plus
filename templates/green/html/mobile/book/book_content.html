    console.log(speechSynthesis.getVoices());

    $(window).on('beforeunload', function () {
        if (speechSynthesis.speaking) {
            speechSynthesis.cancel()
        }
    });

    function speakChapter() {
        console.log('speechSynthesis.paused', speechSynthesis.paused)
        console.log('speechSynthesis.pending', speechSynthesis.pending)
        console.log('speechSynthesis.speaking', speechSynthesis.speaking)
        if (speechSynthesis.speaking && !speechSynthesis.paused) {
            speechSynthesis.pause();
            return;
        }
        if (speechSynthesis.speaking && speechSynthesis.paused) {
            speechSynthesis.resume();
        }
        speak({
            'text': getSpeakText(),
            'speechRate': 0.5,
            'pitch': 1,
            'lang': 'zh-CN'
        }, function () {
            console.log('语音播放结束');
        }, function () {
            console.log('语音开始播放');
        });


    }

    /**
     * @description 文字转语音方法
     * @public
     * @param { text, rate, lang, volume, pitch } object
     * @param  text 要合成的文字内容，字符串
     * @param  speechRate 读取文字的语速 0.1~10  正常1
     * @param  lang 读取文字时的语言
     * @param  volume  读取时声音的音量 0~1  正常1
     * @param  voice  读取文字的语音服务
     * @param  pitch  读取时声音的音高 0~2  正常1
     * @returns SpeechSynthesisUtterance
     */
    function speak({text, speechRate, lang, volume, pitch, voice}, endEvent, startEvent) {
        if (!window.SpeechSynthesisUtterance) {
            console.warn('当前浏览器不支持文字转语音服务')
            return;
        }

        if (!text) {
            return;
        }

        const speechUtterance = new SpeechSynthesisUtterance();
        speechUtterance.text = text;
        speechUtterance.rate = speechRate || 1;
        speechUtterance.lang = lang || 'zh-CN';
        speechUtterance.volume = volume || 1;
        speechUtterance.pitch = pitch || 1;
        speechUtterance.voice = voice || null;
        speechUtterance.onend = function () {
            endEvent && endEvent();
        };
        speechUtterance.onstart = function () {
            startEvent && startEvent();
        };
        speechSynthesis.speak(speechUtterance);

        return speechUtterance;
    }

    /**
     * 朗读只取正文段落文本，排除段落评论入口等附加元素
     */
    function getSpeakText() {
        var $paras = $('#paragraphList .para-text');
        if ($paras.length > 0) {
            return $paras.map(function () {
                return $(this).text();
            }).get().join('\n');
        }
        return $('#chaptercontent').text();
    }


    /************************************ 段落评论 ************************************/
    // 接口：/book/listParagraphCommentCounts、/book/listParagraphComment、/book/addParagraphComment
    // 段落序号 paragraphIdx 由前端拆分正文顺序确定，同一章节内容不变则稳定
    var BPC_BOOK_ID = $("#bookIdHidden").val();
    var BPC_INDEX_ID = $("#contentIdHidden").val();
    var paraCountMap = {};

    // 段落评论接口层（统一返回 Promise）
    var ParagraphApi = {
        // 拉取各段落评论数 {paragraphIdx: count}
        loadCounts: function () {
            var dfd = $.Deferred();
            $.ajax({
                type: "get",
                url: "/book/listParagraphCommentCounts",
                data: {'bookIndexId': BPC_INDEX_ID},
                dataType: "json",
                success: function (data) {
                    dfd.resolve(data.code == 200 && data.data ? data.data : {});
                },
                error: function () {
                    dfd.resolve({});
                }
            });
            return dfd.promise();
        },
        // 拉取某段评论列表（服务端按时间倒序返回）
        list: function (idx) {
            var dfd = $.Deferred();
            $.ajax({
                type: "get",
                url: "/book/listParagraphComment",
                data: {'bookIndexId': BPC_INDEX_ID, 'paragraphIdx': idx},
                dataType: "json",
                success: function (data) {
                    if (data.code == 200) {
                        dfd.resolve(data.data || []);
                    } else {
                        layer.alert(data.msg);
                        dfd.resolve([]);
                    }
                },
                error: function () {
                    layer.alert('网络异常');
                    dfd.resolve([]);
                }
            });
            return dfd.promise();
        },
        // 发表段落评论/回复（rootId>0表示回复），resolve 完整 RestResult
        add: function (idx, content, rootId, replyUserName, replyUserId) {
            var dfd = $.Deferred();
            $.ajax({
                type: "POST",
                url: "/book/addParagraphComment",
                data: {
                    'bookId': BPC_BOOK_ID,
                    'bookIndexId': BPC_INDEX_ID,
                    'paragraphIdx': idx,
                    'rootId': rootId || 0,
                    'replyUserName': replyUserName || '',
                    'replyUserId': replyUserId || '',
                    'commentContent': content
                },
                dataType: "json",
                success: function (data) {
                    dfd.resolve(data);
                },
                error: function () {
                    dfd.resolve({code: 500, msg: '网络异常，发表失败'});
                }
            });
            return dfd.promise();
        }
    };

    // 把整章HTML拆成段落（正文中的<br>、<p>、<div>均作为段落分隔，其余标签剥除）
    function splitParagraphs() {
        var rawHtml = $('#contentRaw').html() || '';
        var text = rawHtml
            .replace(/<\s*\/?\s*(p|div)[^>]*>/gi, '<br>')
            .replace(/<\s*br\s*\/?>|<\/\s*p\s*>/gi, '\n')
            .replace(/&nbsp;/gi, '\u00A0')
            .replace(/<[^>]+>/g, '');
        var lines = text.split(/\n+/);
        var paras = [];
        for (var i = 0; i < lines.length; i++) {
            var line = $.trim(lines[i]);
            if (line !== '') {
                paras.push(line);
            }
        }
        return paras;
    }

    // 渲染段落列表，每段尾部挂评论入口
    function renderParagraphs() {
        var paras = splitParagraphs();
        var $list = $('#paragraphList').empty();
        for (var i = 0; i < paras.length; i++) {
            var $item = $('<div class="para-item"></div>');
            // 用.text()插入，避免正文内容作为HTML二次解析
            var $p = $('<p class="para-text"></p>').text(paras[i]).appendTo($item);
            var $btn = $('<span class="para-comment-btn" data-idx="' + i + '"></span>');
            // 纯气泡图标，数字角标由 refreshCountChips 填充；float:right 贴在段落最后一行右侧
            $btn.append('<i class="layui-icon">&#xe606;</i>');
            $btn.append('<em class="para-comment-num"></em>');
            $p.append($btn);
            $list.append($item);
        }
        refreshCountChips();
    }

    // 刷新每段气泡角标：有评论高亮并显示总数（含回复），无评论置灰无数字
    function refreshCountChips() {
        ParagraphApi.loadCounts().then(function (counts) {
            paraCountMap = counts || {};
            $('.para-comment-btn').each(function () {
                var num = paraCountMap[String($(this).data('idx'))] || 0;
                $(this).toggleClass('has', num > 0);
                $(this).find('.para-comment-num').text(num > 0 ? num : '');
            });
        });
    }

    // 当前回复目标 {rootId, name}，null表示发表顶层评论
    var pcReplyTarget = null;

    // 打开底部评论面板
    function openCommentPanel(idx) {
        pcReplyTarget = null;
        var panelHtml = '' +
            '<div class="pc-panel">' +
            '  <div class="pc-list" id="pcList"><div class="pc-empty">加载中...</div></div>' +
            '  <div class="pc-input-box">' +
            '    <div id="pcReplyHint"><span class="pc-cancel-reply">取消</span><span id="pcReplyHintText"></span></div>' +
            '    <textarea id="pcContent" class="pc-textarea" maxlength="200" placeholder="说说你对这段话的看法~（至少5个字）"></textarea>' +
            '    <div class="pc-input-bar">' +
            '      <span id="pcNum">0/200</span>' +
            '      <button type="button" id="pcSubmitBtn" class="layui-btn layui-btn-sm">发表</button>' +
            '    </div>' +
            '  </div>' +
            '</div>';
        layer.open({
            type: 1,
            title: '段落评论',
            closeBtn: 1,
            offset: 'b',
            area: ['100%', '60%'],
            content: panelHtml,
            success: function (layero) {
                lockBodyScroll();
                loadCommentList(idx);
                $('#pcContent').on('input propertychange', function () {
                    $('#pcNum').html($(this).val().length + '/200');
                });
                $('#pcSubmitBtn').on('click', function () {
                    submitParagraphComment(idx);
                });
                // 事件委派：点任意层级的“回复”设为回复目标
                $('#pcList').on('click', '.pc-reply-btn', function () {
                    pcReplyTarget = {
                        rootId: $(this).data('root'),
                        name: String($(this).data('name') || ''),
                        uid: $(this).data('uid')
                    };
                    $('#pcReplyHintText').text('回复 @' + pcReplyTarget.name);
                    $('#pcReplyHint').show();
                    focusNoScroll($('#pcContent'));
                });
                $('#pcReplyHint .pc-cancel-reply').on('click', function () {
                    clearReplyTarget();
                });
                kbFixCleanup = fixPanelKeyboard(layero);
            },
            end: function () {
                // 面板销毁：解除页面锁定并移除键盘监听
                unlockBodyScroll();
                if (kbFixCleanup) {
                    kbFixCleanup();
                    kbFixCleanup = null;
                }
            }
        });
    }

    // 面板打开期间锁定body滚动：部分浏览器(iOS/WebView)聚焦输入框会强行滚动document去"露出"输入框，
    // 锁住后document不可滚，页面位置不会变；关闭时用记录的scrollTop还原
    var pcBodyLockTop = 0;

    function lockBodyScroll() {
        pcBodyLockTop = $(window).scrollTop();
        $('body').css({
            position: 'fixed',
            top: -pcBodyLockTop + 'px',
            left: 0,
            right: 0,
            width: '100%',
            overflow: 'hidden'
        });
    }

    function unlockBodyScroll() {
        $('body').css({position: '', top: '', left: '', right: '', width: '', overflow: ''});
        $(window).scrollTop(pcBodyLockTop);
    }

    // 软键盘弹出时把评论面板整体上提，保证输入框不被键盘遮挡（页面已被锁定不会跟着动）
    var kbFixCleanup = null;

    function fixPanelKeyboard(layero) {
        var vv = window.visualViewport;
        if (!vv) {
            return null;
        }
        var handler = function () {
            // 键盘高度 = 布局视口高 - 可视化视口高 - 视口偏移
            var kbH = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
            layero.css('transform', kbH > 80 ? 'translateY(-' + kbH + 'px)' : '');
        };
        vv.addEventListener('resize', handler);
        vv.addEventListener('scroll', handler);
        handler();
        return function () {
            vv.removeEventListener('resize', handler);
            vv.removeEventListener('scroll', handler);
            layero.css('transform', '');
        };
    }

    function clearReplyTarget() {
        pcReplyTarget = null;
        $('#pcReplyHint').hide();
    }

    // 聚焦但不滚动：focus默认会把元素滚进视野，导致页面下移；旧内核不支持preventScroll时手动恢复滚动位置
    function focusNoScroll($el) {
        var st = $(window).scrollTop();
        try {
            $el[0].focus({preventScroll: true});
        } catch (e) {
            $el.focus();
        }
        if ($(window).scrollTop() !== st) {
            $(window).scrollTop(st);
        }
    }

    // 加载某段评论列表（后端返回两级树：顶层倒序，replies正序；createTime已格式化为相对时间）
    function loadCommentList(idx) {
        ParagraphApi.list(idx).then(function (list) {
            var $box = $('#pcList').empty();
            if (!list || list.length == 0) {
                $box.append('<div class="pc-empty">还没有人评论这段话，抢占沙发~</div>');
                return;
            }
            for (var i = 0; i < list.length; i++) {
                $box.append(buildPcItem(list[i]));
            }
        });
    }

    // 构建单条顶层评论（含回复子列表），全部用jQuery .text()填充避免HTML注入
    function buildPcItem(item) {
        var $item = $('<div class="pc-item"></div>');
        var $user = $('<div class="pc-user"></div>');
        $user.append($('<span class="pc-name"></span>').text(item.createUserName));
        if (item.location) {
            $user.append($('<span class="pc-loc"></span>').text(item.location + '读者'));
        }
        $user.append($('<span class="pc-time" style="float:right"></span>').text(item.createTime));
        $item.append($user);
        $item.append($('<div class="pc-content"></div>').text(item.commentContent));

        var replies = item.replies || [];
        if (replies.length > 0) {
            var $rep = $('<div class="pc-reply-list"></div>');
            for (var j = 0; j < replies.length; j++) {
                $rep.append(buildPcReplyItem(item.id, replies[j]));
            }
            $item.append($rep);
        }
        var $op = $('<div class="pc-op-bar"></div>');
        if (replies.length > 0) {
            $op.append($('<span class="pc-reply-num"></span>').text(replies.length + '条回复'));
        }
        $op.append($('<span class="pc-reply-btn">回复</span>').data('root', item.id).data('name', item.createUserName).data('uid', item.createUserId));
        $item.append($op);
        return $item;
    }

    // 构建单条回复（回复目标始终是所属顶层评论）
    function buildPcReplyItem(rootId, r) {
        var $ri = $('<div class="pc-reply-item"></div>');
        var $ru = $('<div class="pc-r-user"></div>');
        $ru.append($('<span class="pc-name"></span>').text(r.createUserName));
        if (r.replyUserName) {
            $ru.append($('<span class="pc-to"></span>').text('回复 ' + r.replyUserName));
        }
        $ru.append($('<span style="float:right"></span>').text(r.createTime));
        $ri.append($ru);
        $ri.append($('<div class="pc-r-content"></div>').text(r.commentContent));
        $ri.append($('<div class="pc-op-bar"></div>')
            .append($('<span class="pc-reply-btn">回复</span>').data('root', rootId).data('name', r.createUserName).data('uid', r.createUserId)));
        return $ri;
    }

    // 防重复提交标志
    var pcSubmitting = false;

    // 发表段落评论
    function submitParagraphComment(idx) {
        if (pcSubmitting) {
            return;
        }
        if (!isLogin) {
            location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
            return;
        }
        var content = $.trim($('#pcContent').val());
        if (content == '') {
            layer.alert('评论内容必须填写');
            return;
        }
        if (content.length < 5) {
            layer.alert('评论内容必须大于5个字');
            return;
        }
        pcSubmitting = true;
        var $btn = $('#pcSubmitBtn');
        $btn.addClass('layui-btn-disabled').attr('disabled', 'disabled').text('提交中...');
        var rootId = pcReplyTarget ? pcReplyTarget.rootId : 0;
        var replyUserName = pcReplyTarget ? pcReplyTarget.name : '';
        var replyUserId = pcReplyTarget ? pcReplyTarget.uid : '';
        ParagraphApi.add(idx, content, rootId, replyUserName, replyUserId).then(function (res) {
            pcSubmitting = false;
            $btn.removeClass('layui-btn-disabled').removeAttr('disabled').text('发表');
            if (res.code == 200) {
                $('#pcContent').val('');
                $('#pcNum').html('0/200');
                clearReplyTarget();
                loadCommentList(idx);
                // 重新拉取各段气泡角标
                refreshCountChips();
            } else if (res.code == 1001) {
                location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
            } else {
                layer.alert(res.msg || '发表失败');
            }
        });
    }

    // 评论入口事件委派
    $('#paragraphList').on('click', '.para-comment-btn', function () {
        openCommentPanel(parseInt($(this).data('idx')));
    });

    // 页面加载：拆分段落并初始化评论入口（VIP未购买章节无正文，自动跳过）
    renderParagraphs();

</script>


</html>
