spring:
  config:
    import: classpath:application-common.yml
  main:
    allow-bean-definition-overriding: true
  data:
    redis:
      #Redis服务器IP
      host: 127.0.0.1
      #Redis服务器连接端口
      port: 6379
      #Redis服务器连接密码
      password: test123456
      #连接超时时间（毫秒）
      timeout: 10000

logging:
  level:
    root: error
    com.java2nb: error

pic:
  save:
    type: 1 #图片保存方式, 1不保存，使用爬取的网络图片 ，2保存在自己的存储介质
    storage: local #存储介质，local：本地，OSS：阿里云对象存储
    path: /Users/xiongxiaoyang/java/  #图片保存路径

content:
  save:
    storage: db #存储介质，db：数据库，file：txt文本
    path: /Users/xiongxiaoyang/books  #txt小说文本保存路径

# HTTP 代理配置
http:
  proxy:
    # 是否开启 HTTP 代理，true-开启，false-不开启
    enabled: false
    # 代理 IP
    ip: 40.83.102.86
    # 代理端口号
    port: 80



