<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>作家管理系统-小说精品屋</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/author.css"/>
    <style type="text/css">
        .author_info .info_title { font-size:17px; color:#333; font-weight:600; padding:20px 0 4px; border-left:4px solid #3eaf7c; padding-left:10px }
        .author_info .info_sub { font-size:12px; color:#99a59e; margin:8px 0 18px; line-height:1.7 }
        .author_info .field { margin-bottom:20px }
        .author_info .field > label { display:block; font-size:13px; color:#5c6b64; margin-bottom:8px }
        .author_info .field > label b { color:#3eaf7c; font-weight:600 }
        .author_info .ipt_wrap { display:flex; align-items:center; box-sizing:border-box; height:42px; padding:0 14px 0 13px; border:1px solid #dfe9e4; border-radius:8px; background:#fbfdfc; transition:border-color .2s, background .2s, box-shadow .2s }
        .author_info .ipt_wrap:focus-within { border-color:#3eaf7c; background:#fff; box-shadow:0 0 0 3px rgba(62,175,124,.12) }
        .author_info .ipt { flex:1; min-width:0; height:40px; line-height:40px; border:0; font-size:13px; color:#333; background:transparent; outline:none }
        .author_info .ipt::placeholder { color:#b3c0b9 }
        .author_info textarea.ipt { height:88px; line-height:1.6; padding:10px 0; resize:vertical }
        .author_info .field.error .ipt_wrap { border-color:#f56c6c; background:#fff }
        .author_info .fhint { font-size:12px; color:#99a59e; line-height:1; margin-top:8px }
        .author_info .field.error .fhint { color:#d9544f }
        .author_info .field.ok .fhint { color:#2c8a61 }
        .author_info .ro_box { height:42px; line-height:42px; padding:0 14px; border-radius:8px; background:#f2faf6; border:1px solid #e6f0ea; color:#2c8a61; font-size:13px }
        .author_info .avatar_wrap { position:relative; width:96px; height:96px; border-radius:50%; overflow:hidden; background:#f6f6f6; border:1px solid #e6f0ea; cursor:pointer }
        .author_info .avatar_wrap img { width:100%; height:100%; object-fit:cover; display:block }
        .author_info .avatar_wrap input[type="file"] { position:absolute; left:0; top:0; width:100%; height:100%; opacity:0; cursor:pointer; z-index:3 }
        .author_info .avatar_mask { position:absolute; left:0; bottom:0; width:100%; padding:4px 0; text-align:center; font-size:12px; color:#fff; background:rgba(0,0,0,.45); z-index:2 }
        .author_info .btn_save { display:inline-block; height:42px; line-height:40px; padding:0 34px; box-sizing:border-box; border:1px solid #3eaf7c; border-radius:21px; background:#3eaf7c; color:#fff; font-size:14px; cursor:pointer }
        .author_info .btn_save:hover { background:#2c8a61; border-color:#2c8a61 }
        .author_info .btn_save:disabled { background:#c8ead9; border-color:#c8ead9; cursor:not-allowed }
    </style>
</head>
<body class="author_zone">

<div class="header">
    <div class="mainNav" id="mainNav">
        <div class="box_center cf"
             style="text-align: center;height: 44px;line-height: 48px;color: #fff;font-size: 16px;">

            小说精品屋作家管理

        </div>
    </div>
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div class="my_l">

            <ul class="log_list">
                <li><a class="link_book" href="/author/index.html">小说管理</a></li>
                <li><a class="link_ai" href="/author/ai_assistant.html">AI创作助手</a></li>
                <li><a class="link_income" href="/author/author_income_detail.html">稿费收入</a></li>
                <li><a class="link_profile on" href="/author/author_info.html">作者信息</a></li>
            </ul>

        </div>
        <div class="my_r author_info">
            <h2 class="info_title">作者信息</h2>
            <p class="info_sub">修改笔名不影响历史作品的署名（作品页仍展示创建时的笔名）。联系方式仅用于编辑与您沟通，不会公开展示。<br/>带 <span style="color:#3eaf7c">*</span> 的项为必填。</p>

            <input type="hidden" id="authorId"/>
            <input type="hidden" id="picUrl" name="picUrl"/>

            <div class="field" id="fAvatar">
                <label>作者头像</label>
                <div class="avatar_wrap" id="avatarWrap">
                    <img id="avatarImg" src="/images/default.gif" alt="头像"/>
                    <input type="file" id="avatarFile" name="file" accept="image/*"/>
                    <span class="avatar_mask">更换头像</span>
                </div>
                <p class="fhint">点击圆形区域选择图片上传，支持 jpg/png，建议正方形</p>
            </div>

            <div class="field" id="fPenName">
                <label for="penName">作者笔名 <b>*</b></label>
                <div class="ipt_wrap">
                    <input class="ipt" type="text" id="penName" maxlength="8" autocomplete="off" placeholder="2-8位中文或英文笔名"/>
                </div>
                <p class="fhint" id="penHint">笔名将展示在作品页面，失焦时校验是否已被占用</p>
            </div>

            <div class="field" id="fDirection">
                <label>作品方向</label>
                <div class="ro_box" id="workDirectionText">未设置</div>
                <p class="fhint">作品方向创建后不可修改</p>
            </div>

            <div class="field" id="fIntro">
                <label for="intro">作者简介</label>
                <div class="ipt_wrap" style="height:auto; align-items:flex-start">
                    <textarea class="ipt" id="intro" maxlength="500" placeholder="一句话介绍你自己，最多500字"></textarea>
                </div>
                <p class="fhint">选填，展示在作者主页</p>
            </div>

            <div class="field" id="fTel">
                <label for="telPhone">手机号码 <b>*</b></label>
                <div class="ipt_wrap">
                    <input class="ipt" type="text" id="telPhone" maxlength="11" autocomplete="off" placeholder="便于编辑与您联系"/>
                </div>
                <p class="fhint">请填写 11 位中国大陆手机号</p>
            </div>

            <div class="field" id="fChat">
                <label for="chatAccount">QQ 或微信</label>
                <div class="ipt_wrap">
                    <input class="ipt" type="text" id="chatAccount" maxlength="20" autocomplete="off" placeholder="请填写QQ号或微信号"/>
                </div>
                <p class="fhint">选填</p>
            </div>

            <div class="field" id="fEmail">
                <label for="email">电子邮箱 <b>*</b></label>
                <div class="ipt_wrap">
                    <input class="ipt" type="text" id="email" maxlength="50" autocomplete="off" placeholder="example@mail.com"/>
                </div>
                <p class="fhint">用于接收平台通知</p>
            </div>

            <button type="button" class="btn_save" id="btnSave">保存修改</button>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/javascript/ajaxfileupload.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script src="/javascript/common.js" type="text/javascript"></script>

<script language="javascript" type="text/javascript">
    var originPenName = '';

    $(function () {
        loadAuthorInfo();

        $('#avatarFile').on('change', function () {
            if (!checkPicUpload(this)) {
                return;
            }
            $.ajaxFileUpload({
                url: '/file/picUpload',
                secureuri: false,
                fileElementId: 'avatarFile',
                dataType: 'json',
                type: 'post',
                success: function (data) {
                    if (data.code == 200) {
                        $('#picUrl').val(data.data);
                        $('#avatarImg').attr('src', data.data);
                    } else {
                        layer.alert(data.msg);
                    }
                },
                error: function () {
                    layer.alert('头像上传失败，请重试');
                }
            });
        });

        $('#penName').on('blur', function () {
            var penName = $.trim($(this).val());
            if (!penName) {
                return;
            }
            if (!/^[\u4e00-\u9fa5a-zA-Z]{2,8}$/.test(penName)) {
                setError('fPenName', '笔名需为2到8位的中文或英文字母');
                return;
            }
            if (penName === originPenName) {
                //未改动，无需查重
                resetHint('fPenName', '笔名将展示在作品页面，失焦时校验是否已被占用');
                return;
            }
            $.ajax({
                type: 'get',
                url: '/author/checkPenName',
                data: {penName: penName, excludeAuthorId: $('#authorId').val()},
                dataType: 'json',
                cache: false,
                success: function (result) {
                    if (result && result.code == 200) {
                        if (result.data) {
                            setError('fPenName', '笔名已被使用，请更换一个');
                        } else {
                            setOk('fPenName', '笔名可以使用');
                        }
                    }
                },
                error: function () {
                    resetHint('fPenName', '笔名校验失败，请稍后重试');
                }
            });
        }).on('focus', function () {
            resetHint('fPenName', '笔名将展示在作品页面，失焦时校验是否已被占用');
        });

        $('.ipt').on('focus', function () {
            $(this).closest('.field').removeClass('error ok');
        });

        $('#btnSave').on('click', saveInfo);
    });

    function setError(fieldId, msg) {
        var $f = $('#' + fieldId);
        $f.removeClass('ok').addClass('error').find('.fhint').text(msg);
    }

    function setOk(fieldId, msg) {
        var $f = $('#' + fieldId);
        $f.removeClass('error').addClass('ok').find('.fhint').text(msg);
    }

    function resetHint(fieldId, msg) {
        var $f = $('#' + fieldId);
        $f.removeClass('error ok').find('.fhint').text(msg);
    }

    function loadAuthorInfo() {
        $.ajax({
            type: 'get',
            url: '/author/authorInfo',
            dataType: 'json',
            cache: false,
            success: function (result) {
                if (result.code == 200 && result.data) {
                    var a = result.data;
                    $('#authorId').val(a.id);
                    originPenName = a.penName || '';
                    $('#penName').val(a.penName);
                    $('#intro').val(a.intro || '');
                    $('#telPhone').val(a.telPhone || '');
                    $('#chatAccount').val(a.chatAccount || '');
                    $('#email').val(a.email || '');
                    if (a.picUrl) {
                        $('#picUrl').val(a.picUrl);
                        $('#avatarImg').attr('src', a.picUrl);
                    }
                    $('#workDirectionText').text(a.workDirection == 0 ? '男频' : (a.workDirection == 1 ? '女频' : '未设置'));
                } else if (result.code == 1001) {
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
                } else {
                    layer.alert(result.msg);
                }
            },
            error: function () {
                layer.alert('网络异常');
            }
        });
    }

    function saveInfo() {
        var penName = $.trim($('#penName').val());
        var telPhone = $.trim($('#telPhone').val());
        var email = $.trim($('#email').val());
        var chatAccount = $.trim($('#chatAccount').val());
        var intro = $.trim($('#intro').val());

        var valid = true;
        if (!penName || !/^[\u4e00-\u9fa5a-zA-Z]{2,8}$/.test(penName)) {
            setError('fPenName', '笔名需为2到8位的中文或英文字母');
            valid = false;
        }
        if (!/^1[3-9]\d{9}$/.test(telPhone)) {
            setError('fTel', '请填写正确的11位手机号码');
            valid = false;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            setError('fEmail', '请填写正确的电子邮箱');
            valid = false;
        }
        if (!valid) {
            return;
        }

        $('#btnSave').prop('disabled', true).text('保存中…');
        $.ajax({
            type: 'post',
            url: '/author/updateAuthorInfo',
            data: {
                penName: penName,
                picUrl: $('#picUrl').val(),
                intro: intro,
                telPhone: telPhone,
                chatAccount: chatAccount,
                email: email
            },
            dataType: 'json',
            success: function (result) {
                $('#btnSave').prop('disabled', false).text('保存修改');
                if (result.code == 200) {
                    originPenName = penName;
                    layer.msg('保存成功', {icon: 1});
                } else if (result.code == 1001) {
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
                } else {
                    layer.alert(result.msg);
                }
            },
            error: function () {
                $('#btnSave').prop('disabled', false).text('保存修改');
                layer.alert('网络异常');
            }
        });
    }
</script>
</html>
