        <link rel="stylesheet" href="/css/author.css"/>
        <style type="text/css">
            .idm_cards { display:flex; flex-wrap:wrap; margin:4px 0 18px }
            .idm_card { min-width:200px; flex:1; margin:0 14px 14px 0; padding:16px 18px; border:1px solid #e6f0ea; border-radius:10px; background:linear-gradient(135deg,#f2faf6,#fbfdfc) }
            .idm_card .bn { font-size:14px; color:#333; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
            .idm_card .money { font-size:22px; color:#2c8a61; font-weight:600; margin:8px 0 4px }
            .idm_card .sub { font-size:12px; color:#99a59e }
            .idm_card a { display:inline-block; margin-top:8px; font-size:12px; color:#3eaf7c; text-decoration:none }
            .idm_rule { margin:0 0 16px; border:1px solid #e6f0ea; border-radius:10px; overflow:hidden }
            .idm_rule .hd { padding:12px 16px; background:#f2faf6; color:#2c8a61; font-size:13px; cursor:pointer; font-weight:600 }
            .idm_rule .bd { padding:14px 16px; font-size:13px; color:#5c6b64; line-height:1.9; display:none }
            .idm_rule .bd.open { display:block }
            .idm_rule .bd b { color:#2c8a61 }
            .idm_rule .bd .ex { margin-top:8px; padding:10px 12px; background:#fbfdfc; border-radius:8px; color:#2c8a61 }
        </style>
    </head>
</head>
<body class="author_zone">

<div th:replace="author/common/header :: header"></div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="author/common/menu :: menu('income')"></div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div class="title cf income_tabs">
                    <a href="/author/author_income_detail.html" class="itab active">订阅明细</a>
                    <a href="/author/author_income.html" class="itab">稿费汇总</a>
                </div>

                <div id="summaryCards" class="idm_cards" style="display:none"></div>
                <div class="idm_rule">
                    <div class="hd" id="ruleToggle">分成规则说明 ▾</div>
                    <div class="bd" id="ruleBody">加载中…</div>
                </div>

                <div id="divData" class="updateTable">
                    <table cellpadding="0" cellspacing="0">
                        <thead>
                        <tr>
                            <th class="goread">
                                日期
                            </th>
                            <th class="goread">
                                订阅总额
                            </th>
                            <th class="goread">
                                订阅次数
                            </th>
                            <th class="goread">
                                订阅人数
                            </th>
                        </tr>
                        </thead>
                        <tbody id="bookList">


                        </tbody>
                    </table>
                    <div class="pageBox cf" id="shellPage">
                    </div>
                </div>

                    <table cellpadding="0" cellspacing="0">
                        <thead>
                        <tr>

                            <th class="name">
                                爬虫源（已开启的爬虫源）

                                成功爬取数量（websocket实现）
                            </th>

                        </tr>
                        </thead>
                        <tbody id="bookShelfList">



                        </tbody>
                    </table>
                    <div class="pageBox cf" id="shellPage">
                    </div>
                </div>-->
            </div>
        </div>
    </div>
</div>


</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script src="/javascript/common.js" type="text/javascript"></script>

<script language="javascript" type="text/javascript">
    var bookId = getSearchString("bookId");
    search(1, 10);
    loadSummary();
    loadRule();

    //数字缩写：超过10万用“万”作单位
    function fmtNum(n) {
        var num = Number(n || 0);
        if (isNaN(num)) {
            num = 0;
        }
        return num >= 100000 ? (num / 10000).toFixed(1).replace(/\.0$/, '') + '万' : String(num);
    }

    function escapeHtml(str) {
        return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    //按书汇总卡片：bookId>0 时仅当前书，否则逐书展示
    function loadSummary() {
        var data = {};
        if (bookId) {
            data.bookId = bookId;
        }
        $.ajax({
            type: 'get',
            url: '/author/bookIncomeSummary',
            data: data,
            dataType: 'json',
            success: function (result) {
                if (result.code == 200 && result.data && result.data.length > 0) {
                    var html = '';
                    for (var i = 0; i < result.data.length; i++) {
                        var s = result.data[i];
                        html += '<div class="idm_card">'
                            + '<div class="bn" title="' + escapeHtml(s.bookName) + '">' + escapeHtml(s.bookName) + '</div>'
                            + '<div class="money">' + fmtNum(s.incomeAccount) + ' 屋币</div>'
                            + '<div class="sub">订阅 ' + fmtNum(s.incomeCount) + ' 次 · ' + fmtNum(s.incomeNumber) + ' 人</div>'
                            + (bookId ? '' : '<a target="_blank" href="/author/author_income_detail.html?bookId=' + s.bookId + '">查看该书明细 ›</a>')
                            + '</div>';
                    }
                    $("#summaryCards").html(html).show();
                }
            }
        });
    }

    //分成规则说明
    function loadRule() {
        $.ajax({
            type: 'get',
            url: '/author/incomeRule',
            dataType: 'json',
            success: function (result) {
                if (result.code == 200 && result.data) {
                    var r = result.data;
                    var pre = 100 * r.shareProportion * r.exchangeProportion;
                    var after = pre * r.taxRate;
                    var html = '读者订阅花费的屋币，按以下规则按月结算给作者（税后金额精确到分）：'
                        + '<br/>· 分成比例：<b>' + Math.round(r.shareProportion * 100) + '%</b>（作者获得订阅金额的该比例）'
                        + '<br/>· 兑换比率：<b>1 屋币 = ' + r.exchangeProportion + ' 元</b>'
                        + '<br/>· 税后所得比率：<b>' + Math.round(r.taxRate * 100) + '%</b>（即代扣 ' + (100 - Math.round(r.taxRate * 100)) + '% 税费）'
                        + '<div class="ex">换算示例：读者消费 100 屋币 → 作者税前约 ' + pre.toFixed(2) + ' 元 → 税后约 ' + after.toFixed(2) + ' 元。</div>';
                    $('#ruleBody').html(html);
                } else {
                    $('#ruleBody').text('暂无规则信息');
                }
            },
            error: function () {
                $('#ruleBody').text('规则加载失败');
            }
        });
    }

    $('#ruleToggle').on('click', function () {
        $('#ruleBody').toggleClass('open');
    });

    function search(curr, limit) {

        var data = {'curr': curr, 'limit': limit};

        if (bookId) {
            data.bookId = bookId;
        }

        $.ajax({
            type: "get",
            url: "/author/listIncomeDailyByPage",
            data: data,
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var bookList = data.data.list;
                    if (bookList.length > 0) {
                        var bookListHtml = "";
                        for (var i = 0; i < bookList.length; i++) {
                            var book = bookList[i];
                            bookListHtml += (" <tr class=\"book_list\" >\n" +
                                "                            <td class=\"goread\">\n" +
                                "                                " + book.incomeDate + "</td>\n" +
                                "                            <td class=\"goread\" >"
                                + book.incomeAccount + "</td>\n" +
                                "                            <td class=\"goread\">\n" +
                                "                                " + book.incomeCount + "\n" +
                                "                            </td>\n" +
                                "                            <td class=\"goread\">" + book.incomeNumber +
                                "                            </td>\n" +

                                " </tr>");
                        }
                        $("#bookList").html(bookListHtml);

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            //执行一个laypage实例
                            laypage.render({
                                elem: 'shellPage' //注意，这里的 test1 是 ID，不用加 # 号
                                , count: data.data.total //数据总数，从服务端得到,
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , jump: function (obj, first) {


                                    //obj包含了当前分页的所有参数，比如：
                                    console.log(obj.curr); //得到当前页，以便向服务端请求对应页的数据。
                                    console.log(obj.limit); //得到每页显示的条数


                                    //首次不执行
                                    if (!first) {
                                        search(obj.curr, obj.limit);
                                    } else {

                                    }
                                }
                            });
                        });

                    }


                } else if (data.code == 1001) {
                    //未登录
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })

    }


    function updateBookStatus(bookId, status) {

        $.ajax({
            type: "POST",
            url: "/author/updateBookStatus",
            data: {'bookId': bookId, 'status': status == 0 ? 1 : 0},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {

                    location.reload();


                } else if (data.code == 1001) {
                    //未登录
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })


    }
</script>
</html>
