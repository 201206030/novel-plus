<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head th:replace="common/header :: common_head(~{::title},~{::meta},~{::link},~{})">
    <title th:text="${application.website.name}+'_原创小说网站'"></title>
    <meta name="keywords" th:content="${application.website.keyword}"/>
    <meta name="description"
          th:content="${application.website.description}"/>
    <link href="/favicon.ico" type="image/x-icon" rel="shortcut icon"/>
    <link href="/favicon.ico" type="image/x-icon" rel="Bookmark"/>
    <link rel="stylesheet" href="/css/main.css"/>
    <!-- 首页专属美化（卡片化/徽标等），限定在 .home 作用域，不影响共用 main.css 的页面 -->
    <link rel="stylesheet" href="/css/home.css"/>
</head>
<body>


<div th:replace="common/top :: top('0')">
</div>

<div class="main box_center cf home">
    <div class="channelWrap channelBanner cf">
        <div class="leftBox">
            <div class="sliderContent">
                <dl class="scBigImg" id="carouseBig" th:if="${bookMap['0']}" >
                    <dd th:each="book,iterStat : ${bookMap['0']}" th:class="${iterStat.first}? 'on'"><a th:href="'/book/'+${book.bookId}+'.html'">
                        <img th:src="${book.picUrl}" th:alt="${book.bookName}"/></a></dd>
                </dl>
                <div class="scSmallImg" id="carouseSmall" >
                    <ul th:if="${bookMap['0']}">
                        <li th:each="book,iterStat : ${bookMap['0']}" th:class="${iterStat.first}? 'on'">
                        <img th:src="${book.picUrl}" th:alt="${book.bookName}"/></li>
                    </ul>
                </div>
            </div>
            <div class="hot_articles">
                <!-- 长篇好书 TOP10（对应后台推荐类型 type=1，固定10本）：拆成两列编号列表（1-5 / 6-10），整块 flex 撑满轮播旁的剩余高度 -->
                <div class="ha_box">
                    <h4 class="ha_tit">长篇好书</h4>
                    <div class="ha_cols">
                        <ul class="ha_col" th:if="${bookMap['1']} and ${#lists.size(bookMap['1']) > 0}">
                            <li th:each="book,iterStat : ${bookMap['1']}" th:if="${iterStat.index < 5}">
                                <i th:text="${iterStat.index + 1}"></i><a th:href="'/book/'+${book.bookId}+'.html'" th:text="${book.bookName}" th:title="${book.bookName}"></a>
                            </li>
                        </ul>
                        <ul class="ha_col" th:if="${bookMap['1']} and ${#lists.size(bookMap['1']) > 5}">
                            <li th:each="book,iterStat : ${bookMap['1']}" th:if="${iterStat.index >= 5}">
                                <i th:text="${iterStat.index + 1}"></i><a th:href="'/book/'+${book.bookId}+'.html'" th:text="${book.bookName}" th:title="${book.bookName}"></a>
                            </li>
                        </ul>
                    </div>
                </div>

                <!-- 新闻公告（固定2条）：单行走马灯，列表由 JS 纵向逐条滚动 -->
                <div class="ha_news" th:if="${newsList} and ${#lists.size(newsList) > 0}">
                    <div class="nm_box">
                        <h4 class="ha_tit">新闻公告</h4>
                        <div class="news_marquee" id="newsMarquee">
                            <ul class="nm_list">
                                <li th:each="news : ${newsList}">
                                    <span th:text="'['+${news.catName}+']'"></span><a th:href="'/about/newsInfo-'+${news.id}+'.html'" th:utext="${news.title}" th:title="${news.title}"></a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="rightBox">
            <div class="title cf">
                <h3>本周强推</h3>
                <a class="title_more" href="/book/book_ranking.html">查看更多&gt;</a>
            </div>
            <div class="rightList">
                <ul id="currentWeek" th:if="${bookMap['2']}">
                    <li th:each="book,iterStat : ${bookMap['2']}" th:class="${iterStat.first}? 'on num1': (${iterStat.index < 3}? 'num'+${iterStat.index+1})">
                        <div class="book_name"><i th:text="${iterStat.index+1}"></i><a class="name" th:href="'/book/'+${book.bookId}+'.html'" th:text="${book.bookName}"></a></div>
                        <div class="book_intro">
                            <div class="cover"><a th:href="'/book/'+${book.bookId}+'.html'"><img th:src="${book.picUrl}" th:alt="${book.bookName}"></a>
                            </div>
                            <a class="txt" th:href="'/book/'+${book.bookId}+'.html'" th:utext="${book.bookDesc}"></a>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <div class="channelWrap channelPic cf">
        <div class="leftBox">
            <div class="title">
                <h2 class="on">热门推荐</h2>
                <a class="title_more" href="/book/bookclass.html">查看更多&gt;</a>
            </div>
            <div class="picRecommend cf" id="hotRecBooks" th:if="${bookMap['3']}">
                <div class="itemsList" th:each="book : ${bookMap['3']}">
                    <a class="items_img" th:href="'/book/'+${book.bookId}+'.html'">
                        <img class="lazyload" src="/images/default.gif" th:data-src="${book.picUrl}" th:alt="${book.bookName}">
                    </a>
                    <div class="items_txt">
                        <h4><a th:href="'/book/'+${book.bookId}+'.html'" th:text="${book.bookName}"></a></h4>
                        <p class="author"><a href="javascript:void(0)" th:text="'作者：'+${book.authorName}"></a></p>
                        <p class="intro"><a th:href="'/book/'+${book.bookId}+'.html'" th:utext="${book.bookDesc}"></a>
                        </p>
                    </div>
                </div>

            </div>
        </div>
        <div id="bookrank1_ShowBookRank">
            <div class="rightBox ">
                <div class="title cf">
                    <h3 class="on">点击榜单</h3>
                </div>
                <div class="rightList">
                    <ul id="clickRankBooks">


                    </ul>
                    <div class="more"><a href="/book/book_ranking.html">查看更多&gt;</a></div>
                </div>
            </div>
        </div>
    </div>
    <div class="channelWrap channelPic cf">
        <div class="leftBox">
            <div class="title">
                <h2>精品推荐</h2>
                <a class="title_more" href="/book/bookclass.html">查看更多&gt;</a>
            </div>
            <div class="picRecommend cf" id="classicBooks" th:if="${bookMap['4']}">
                <div class="itemsList" th:each="book : ${bookMap['4']}">
                    <a class="items_img" th:href="'/book/'+${book.bookId}+'.html'">
                        <img class="lazyload" src="/images/default.gif" th:data-src="${book.picUrl}" th:alt="${book.bookName}">
                    </a>
                    <div class="items_txt">
                        <h4><a th:href="'/book/'+${book.bookId}+'.html'" th:text="${book.bookName}"></a></h4>
                        <p class="author"><a href="javascript:void(0)" th:text="'作者：'+${book.authorName}"></a></p>
                        <p class="intro"><a th:href="'/book/'+${book.bookId}+'.html'" th:utext="${book.bookDesc}"></a>
                        </p>
                    </div>
                </div>

            </div>
        </div>
        <div id="bookrank2_ShowBookRank">
            <div class="rightBox ">
                <div class="title cf">
                    <h3 class="on">新书榜单</h3>
                </div>
                <div class="rightList">
                    <ul id="newRankBooks">


                    </ul>
                    <div class="more"><a href="/book/book_ranking.html?type=1">查看更多&gt;</a></div>
                </div>
            </div>
        </div>
    </div>
    <div class="channelWrap channelTable cf">
        <div class="leftBox">
            <div class="title">
                <h2>最新更新</h2>
            </div>
            <div class="updateTable">
                <table cellpadding="0" cellspacing="0">
                    <thead>
                    <tr>
                        <th class="style">类别</th>
                        <th class="name">书名</th>
                        <th class="chapter">最新章节</th>
                        <th class="author">作者</th>
                        <th class="time">更新时间</th>
                    </tr>
                    </thead>
                    <tbody id="updateBooksTable">


                    </tbody>
                </table>
            </div>
        </div>
        <div id="bookrank5_ShowBookRank">
            <div class="rightBox mb20">
                <div class="title cf">
                    <h3 class="on">更新榜单</h3>
                </div>
                <div class="rightList">
                    <ul id="updateRankBooks">


                    </ul>
                    <div class="more"><a href="/book/book_ranking.html?type=2">查看更多&gt;</a></div>
                </div>
            </div>
        </div>

    </div>
</div>
<div class="friend_link">
    <div class="box_center cf" id="friendLink">
        <span>友情链接：</span>
    </div>
</div>

<div th:replace="common/footer :: footer">
</div>


</body>
<div th:replace="common/js :: js"></div>
<script src="/javascript/lazyload.js" type="text/javascript"></script>
<script language="javascript" type="text/javascript">
    var $div = $('.scBigImg dl');//放置大图容器
    var $nav = $('.scSmallImg li');//放置缩略图容器
    var num = -1;
    var open;

    function changeKv() {
        if (num >= $nav.length - 1) {
            num = 0;
        } else {
            num++;
        }
        $nav.eq(num).trigger('mouseenter');
        open = setTimeout(changeKv, 3000);
    }

    changeKv();
    $nav.each(function (index) {
        $(this).off('mouseenter').on('mouseenter', function () {
            clearTimeout(open);

            $(this).addClass('on').siblings().removeClass('on');
            $('.scBigImg dd').eq(index).addClass('on').siblings().removeClass('on');
            $('.scSmallImg').off('mouseleave').on('mouseleave', function () {
                num = index;
                setTimeout(function () {
                    changeKv();
                }, 3000)
            })
        });
    });
    $div.each(function () {
        $(this).off('mouseenter').on('mouseenter', function () {
            clearTimeout(open);
        });
    });

    lazyload();

    // 简介/书名可能带HTML标签，拼接前先剥离并截断，防止撑破行高或破坏页面结构
    function plainText(v, max) {
        var t = String(v === null || v === undefined ? '' : v).replace(/<[^>]*>/g, '');
        return t.length > max ? t.substring(0, max) + '…' : t;
    }

    // 右侧榜单通用渲染：点击榜/新书榜/更新榜均固定展示前10条，仅第1条带封面+简介
    function renderRankBooks(list, elId) {
        var html = '';
        for (var i = 0; i < list.length; i++) {
            var book = list[i];
            var classHtml = (i === 0 ? 'on' : '') + (i < 3 ? ' num' + (i + 1) : '');
            var imageHtml = i === 0 ? '<img src="' + book.picUrl + '" alt="' + plainText(book.bookName, 30) + '"/>' : '';
            html += '<li class="' + classHtml + '">'
                + '<div class="book_name"><i>' + (i + 1) + '</i><a class="name" href="/book/' + book.id + '.html">' + plainText(book.bookName, 20) + '</a></div>'
                + '<div class="book_intro"><div class="cover"><a href="/book/' + book.id + '.html">' + imageHtml + '</a></div>'
                + '<a class="txt" href="/book/' + book.id + '.html">' + plainText(book.bookDesc, 60) + '</a></div>'
                + '</li>';
        }
        $('#' + elId).html(html);
    }

    // 新闻公告走马灯：单行纵向逐条滚动，滚完最后一条接回首条；鼠标悬停暂停
    function initNewsMarquee() {
        var box = $('#newsMarquee'), list = box.find('.nm_list');
        if (!list.length) {
            return;
        }
        var items = list.children(), count = items.length;
        if (count < 2) {
            return;
        }
        var rowH = items.first().outerHeight(true);
        items.first().clone().appendTo(list);// 末尾补一条副本，实现无缝回卷
        var idx = 0, timer = null;
        function step() {
            idx++;
            list.css('margin-top', -idx * rowH);
            if (idx === count) {
                setTimeout(function () {// 滚到副本后瞬间复位到首条，关闭过渡避免倒带动画
                    list.css({transition: 'none', marginTop: 0});
                    void list[0].offsetHeight;
                    list.css('transition', '');
                    idx = 0;
                }, 500);
            }
        }
        function play() {
            stop();
            timer = setInterval(step, 3000);
        }
        function stop() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
        }
        box.hover(stop, play);
        play();
    }

    // 最新更新表格：展示后端返回的全部数据（固定23本），不截断行数
    function renderUpdateTable(list) {
        var html = '';
        for (var i = 0; i < list.length; i++) {
            var book = list[i];
            html += '<tr>'
                + '<td class="style"><a href="/book/bookclass.html?c=' + book.catId + '">[' + plainText(book.catName, 8) + ']</a></td>'
                + '<td class="name"><a href="/book/' + book.id + '.html">' + plainText(book.bookName, 16) + '</a></td>'
                + '<td class="chapter"><a href="/book/' + book.id + '.html">' + plainText(book.lastIndexName, 16) + '</a></td>'
                + '<td class="author"><a href="javascript:void(0)">' + plainText(book.authorName, 8) + '</a></td>'
                + '<td class="time">' + (book.lastIndexUpdateTime || '') + '</td>'
                + '</tr>';
        }
        $('#updateBooksTable').html(html);
    }

    $(function () {

        initNewsMarquee();

        //点击榜单数据查询
        $.ajax({
            type: "get",
            url: "/book/listClickRank",
            data: {},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    // 首位展开项收到 111px 后高度余量够了，后端10本全部展示（与左卡三行六本≈533px 相差约25px，由等高拉伸吸收）
                    renderRankBooks(data.data, 'clickRankBooks');
                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })
        //新书榜单查询
        $.ajax({
            type: "get",
            url: "/book/listNewRank",
            data: {},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    // 同上：首位展开项收小后，后端10本全部展示
                    renderRankBooks(data.data, 'newRankBooks');
                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })
        //更新榜单查询
        $.ajax({
            type: "get",
            url: "/book/listUpdateRank",
            data: {},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    // 更新榜后端固定返回23本：右侧榜单只取前10，左侧表格展示全部
                    renderRankBooks(data.data.slice(0, 10), 'updateRankBooks');
                    renderUpdateTable(data.data);
                } else {
                    layer.alert(data.msg);
                }

            }
            ,
            error: function () {
                layer.alert('网络异常');
            }
        })
        //友情链接查询
        $.ajax({
            type: "get",
            url: "/friendLink/listIndexLink",
            data: {},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var friendLinkList = data.data;
                    var friendLinkHtml = "";
                    for (var i = 0; i < friendLinkList.length; i++) {
                        var friendLink = friendLinkList[i];
                        friendLinkHtml += ("<a target='_blank' href=\"" + friendLink.linkUrl + "\">" + friendLink.linkName + "</a>");
                    }
                    $("#friendLink").append(friendLinkHtml);
                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        });
    });
</script>
</html>
