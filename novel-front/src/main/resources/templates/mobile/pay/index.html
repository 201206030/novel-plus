<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title th:text="${application.website.name}+'充值'"></title>

    <meta name="keywords"
          th:content="${application.website.name}+',精品小说,弹幕网站,弹幕,弹幕小说网站,免费小说,小说阅读,小说排行,轻小说,txt小说下载,电子书下载,动漫轻小说,日本轻小说'">

    <meta name="description"
          th:content="${application.website.name}+'是国内优秀的小说弹幕网站,'+${application.website.name}+'提供海量热门网络小说,日本轻小说,国产轻小说,动漫小说,轻小说在线阅读和TXT小说下载,致力于网络精品小说的收集,智能计算小说评分,打造小说精品排行榜,致力于无广告无弹窗的小说阅读环境。'">


    <div th:include="mobile/common/css :: css"></div>

    <style type="text/css">
        body {
            background: #f5f7f6;
        }

        div, p {
            word-break: break-all;
            word-wrap: break-word;
            box-sizing: border-box;
        }

        /* 账户卡片 */
        .account-card {
            margin: 12px;
            padding: 16px;
            background: linear-gradient(135deg, #3eaf7c, #2c8a61);
            border-radius: 10px;
            color: #fff;
            box-shadow: 0 4px 12px rgba(62, 175, 124, .25);
        }

        .account-card .acc-row {
            font-size: 13px;
            opacity: .9;
        }

        .account-card .acc-bal {
            margin-top: 14px;
            font-size: 12px;
            opacity: .85;
        }

        .account-card .acc-num {
            margin-top: 2px;
            font-size: 28px;
            font-weight: 600;
            line-height: 34px;
        }

        /* 区块标题 */
        .section-label {
            margin: 16px 12px 4px;
            font-size: 15px;
            font-weight: 600;
            color: #1f2d26;
        }

        /* 金额九宫格 */
        .amount-grid {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-wrap: wrap;
            flex-wrap: wrap;
            padding: 4px 8px;
        }

        .amount-item {
            -webkit-flex: 0 0 31%;
            flex: 0 0 31%;
            width: 31%;
            margin: 8px 1.16%;
            padding: 14px 0 12px;
            background: #fff;
            border: 1px solid #e6ece9;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .amount-item strong {
            display: block;
            font-size: 17px;
            font-weight: 600;
            color: #1f2d26;
        }

        .amount-item .pay_mn {
            display: block;
            margin-top: 4px;
            font-size: 11px;
            color: #98a8a1;
        }

        .amount-item:active {
            border-color: #3eaf7c;
            background: rgba(62, 175, 124, .06);
        }

        .amount-item:active strong {
            color: #2e8b62;
        }

        /* 汇率提示 */
        .pay-tip {
            margin: 10px 12px 20px;
            text-align: center;
            font-size: 12px;
            color: #98a8a1;
        }
    </style>
</head>
<body>


<input type="hidden" id="limit" th:value="${limit}"/>
<input type="hidden" id="curr" th:value="${curr}"/>
<input type="hidden" id="total" th:value="${total}"/>
<input type="hidden" id="ids" th:value="${ids}"/>
<input type="hidden" id="bookStatus" th:value="${bookStatus}"/>
<input type="hidden" id="token" th:value="${token}"/>
<input type="hidden" id="keyword" th:value="${keyword}"/>
<input type="hidden" id="catId" th:value="${catId}"/>
<input type="hidden" id="sortBy" th:value="${sortBy}"/>
<input type="hidden" id="sort" th:value="${sort}"/>

<div th:replace="mobile/common/header :: pageHeader('充值', null)"></div>
<div id="body">
    <div class="account-card">
        <div class="acc-row">充值账号：<span id="my_name">-</span></div>
        <div class="acc-bal">当前余额（屋币）</div>
        <div class="acc-num"><span id="accountBalance">0</span></div>
    </div>

    <div class="section-label">选择充值金额</div>
    <div id="payAmount" class="amount-grid">
        <div class="amount-item" vals="10"><strong>10元</strong><span class="pay_mn">1000屋币</span></div>
        <div class="amount-item" vals="30"><strong>30元</strong><span class="pay_mn">3000屋币</span></div>
        <div class="amount-item" vals="50"><strong>50元</strong><span class="pay_mn">5000屋币</span></div>
        <div class="amount-item" vals="100"><strong>100元</strong><span class="pay_mn">10000屋币</span></div>
        <div class="amount-item" vals="200"><strong>200元</strong><span class="pay_mn">20000屋币</span></div>
        <div class="amount-item" vals="500"><strong>500元</strong><span class="pay_mn">50000屋币</span></div>
    </div>
    <div class="pay-tip">当前汇率：1元 = 100屋币，点击金额即可通过支付宝支付</div>

    <form action="/pay/aliPay" method="post" id="payform" name="payform">

        <input type="hidden" id="pValue" name="payAmount"/>
    </form>


</div>
<div th:replace="mobile/common/footer :: footer">
</div>

<a name="buttom"></a>
</body>

<div th:replace="mobile/common/js :: js"></div>

<script>

    //查询用户信息
    $.ajax({
        type: "get",
        url: "/user/userInfo",
        data: {},
        dataType: "json",
        success: function (data) {
            if (data.code == 200) {
                if (data.data.nickName) {
                    $("#my_name").html(data.data.nickName);
                } else {
                    $("#my_name").html(data.data.username);
                }

                $("#accountBalance").html(data.data.accountBalance);

            } else if (data.code == 1001) {
                //未登录
                location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

            } else {
                layer.alert(data.msg);
            }

        },
        error: function () {
            layer.alert('网络异常');
        }
    })

    $("#payAmount").find(".amount-item").click(function () {

        $("#pValue").val($(this).attr("vals"));

        $("#payform").submit();


    });


</script>


</html>
