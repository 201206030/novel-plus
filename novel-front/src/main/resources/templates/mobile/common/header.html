<div th:fragment="pageHeader(title, titleUrl)" class="page-header">
    <a class="ph-btn" href="javascript:history.go(-1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
    </a>
    <a th:if="${titleUrl != null}" class="ph-title" th:href="${titleUrl}" th:utext="${title}"></a>
    <div th:unless="${titleUrl != null}" class="ph-title" th:utext="${title}"></div>
    <a class="ph-btn" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
    </a>
</div>
