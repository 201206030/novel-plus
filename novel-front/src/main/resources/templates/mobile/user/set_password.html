<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <title th:text="'修改密码_' + ${application.website.name}"></title>

    <div th:include="mobile/common/css :: css"></div>

    <style>
        .setup_form {
            padding: 20px 15px;
        }

        .setup_form .layui-input {
            height: 42px;
            line-height: 42px;
            margin-bottom: 12px;
        }

        .setup_form .err {
            color: #ff5722;
            font-size: 13px;
            margin-top: 8px;
            min-height: 18px;
        }

        .setup_form .layui-btn {
            width: 100%;
            margin-top: 5px;
            background-color: #3eaf7c !important;
            border-color: #3eaf7c !important;
        }
    </style>

</head>
<body>
<div id="body">

    <div style="height: 50px;line-height: 50px;text-align: center"
         class="layui-header header header-doc  layui-bg-cyan">

        <div style="width:10%;float: left;margin-left: 10px">
            <a href="javascript:history.go(-1)">
                <i style="font-size: 20px;color: #fff;" class="layui-icon">&#xe65c;</i></a>
        </div>
        <b class="layui-icon">修改密码</b>
        <div style="width:10%;float: right;margin-right: 10px"><a href="/">
            <i style="font-size: 20px;color: #fff;" class="layui-icon">&#xe68e;</i>
        </a>
        </div>
    </div>

    <div class="setup_form">
        <input type="password" id="txtOldPass" class="layui-input" placeholder="请输入原密码"/>
        <input type="password" id="txtNewPass1" class="layui-input" placeholder="请输入新密码"/>
        <input type="password" id="txtNewPass2" class="layui-input" placeholder="请确认新密码"/>
        <div class="err" id="LabErr"></div>
        <button type="button" id="submitBtn" class="layui-btn" onclick="updatePassword()">修改</button>
    </div>

</div>

<div th:replace="mobile/common/footer :: footer">
</div>
</body>

<div th:replace="mobile/common/js :: js">
</div>

<script>
    // 防重复提交标志
    var pwdSubmitting = false;

    function updatePassword() {
        if (pwdSubmitting) {
            return;
        }
        var oldPassword = $("#txtOldPass").val();
        if (oldPassword.isBlank()) {
            $("#LabErr").html("旧密码不能为空！");
            return;
        }
        var newPassword1 = $("#txtNewPass1").val();
        if (newPassword1.isBlank()) {
            $("#LabErr").html("新密码不能为空！");
            return;
        }
        var newPassword2 = $("#txtNewPass2").val();
        if (newPassword2.isBlank()) {
            $("#LabErr").html("确认密码不能为空！");
            return;
        }
        if (newPassword1 !== newPassword2) {
            $("#LabErr").html("两次输入的新密码不匹配！");
            return;
        }
        pwdSubmitting = true;
        var $btn = $('#submitBtn');
        $btn.addClass('layui-btn-disabled').attr('disabled', 'disabled').text('提交中...');
        $.ajax({
            type: "POST",
            url: "/user/updatePassword",
            data: {'oldPassword': oldPassword, 'newPassword1': newPassword1, 'newPassword2': newPassword2},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    window.location.href = '/user/setup.html';

                } else if (data.code == 1001) {
                    //未登录
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    $("#LabErr").html(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            },
            complete: function () {
                pwdSubmitting = false;
                $btn.removeClass('layui-btn-disabled').removeAttr('disabled').text('修改');
            }
        })
    }
</script>


</body>
</html>
