<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">


    <title th:text="${application.website.name}"></title>

    <meta name="keywords" th:content="${application.website.keyword}"/>
    <meta name="description"
          th:content="${application.website.description}"/>


    <div th:include="mobile/common/css :: css"></div>

    <style>
        body {
            background: #f5f7f6;
        }

        /* 资料卡 */
        .profile-card {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            margin: 12px;
            padding: 16px;
            background: linear-gradient(135deg, #3eaf7c, #2c8a61);
            border-radius: 10px;
            color: #fff;
            box-shadow: 0 4px 12px rgba(62, 175, 124, .25);
        }

        .profile-card .avatar {
            -webkit-flex: 0 0 auto;
            flex: 0 0 auto;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, .5);
            background: #fff;
        }

        .profile-card .p-info {
            -webkit-flex: 1;
            flex: 1;
            min-width: 0;
            margin-left: 12px;
        }

        .profile-card .p-name {
            font-size: 17px;
            font-weight: 600;
            line-height: 24px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .profile-card .p-name svg {
            vertical-align: middle;
            margin-left: 4px;
        }

        .profile-card .p-bal {
            margin-top: 6px;
            font-size: 12px;
            opacity: .9;
        }

        .profile-card .p-bal em {
            font-style: normal;
            font-weight: 600;
            font-size: 15px;
        }

        /* 功能列表 */
        .menu-card {
            margin: 0 12px 12px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(62, 175, 124, .08);
            overflow: hidden;
        }

        .menu-item {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            height: 50px;
            padding: 0 14px;
            font-size: 15px;
            color: #1f2d26;
            border-bottom: 1px solid #f5f7f6;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:active {
            background: #f7f9f8;
        }

        .menu-item .mi-icon {
            -webkit-flex: 0 0 auto;
            flex: 0 0 auto;
            width: 28px;
            text-align: center;
            line-height: 1;
        }

        .menu-item .mi-icon .layui-icon {
            font-size: 22px;
            color: #3eaf7c;
        }

        .menu-item .mi-text {
            -webkit-flex: 1;
            flex: 1;
            min-width: 0;
            margin-left: 10px;
        }

        .menu-item .mi-arrow {
            -webkit-flex: 0 0 auto;
            flex: 0 0 auto;
            width: 7px;
            height: 7px;
            border-right: 1.5px solid #c4cec9;
            border-top: 1.5px solid #c4cec9;
            -webkit-transform: rotate(45deg);
            transform: rotate(45deg);
        }

        /* 退出登录 */
        .logout-card {
            display: block;
            margin: 0 12px 12px;
            height: 46px;
            line-height: 46px;
            text-align: center;
            font-size: 15px;
            color: #e05c6e;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(62, 175, 124, .08);
            -webkit-tap-highlight-color: transparent;
        }

        .logout-card:active {
            background: #fdf3f4;
        }
    </style>


</head>
<body>
<div id="body">

</div>

<div th:replace="mobile/common/footer :: footer">
</div>

<div th:replace="mobile/common/js :: js">
</div>


<script>

    //查询用户信息
    $.ajax({
        type: "get",
        url: "/user/userInfo",
        data: {},
        dataType: "json",
        success: function (data) {
            if (data.code == 200) {
                if (data.data.userPhoto) {
                    $("#imgLogo").attr("src", data.data.userPhoto);
                }
                if (data.data.nickName) {
                    $("#my_name").html(data.data.nickName);
                } else {
                    $("#my_name").html(data.data.username);
                }

                if (String(data.data.userSex) === '0') {
                    $("#boyIcon").css("display", "inline")
                }

                if (String(data.data.userSex) === '1') {
                    $("#girlIcon").css("display", "inline")
                }

                $("#accountBalance").html(data.data.accountBalance);

            } else if (data.code == 1001) {
                //未登录
                location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

            } else {
                layer.alert(data.msg);
            }

        },
        error: function () {
            layer.alert('网络异常');
        }
    })


    function moreNewBooks(event) {
        window.location.href = "/book/bookclass.html?sortBy=last_index_update_time";
    }

    function searchBooks() {
        var keywords = $("#title").val();
        window.location.href = "/book/bookclass.html?keyword=" + encodeURI(keywords);
    }

    function toMyCollect() {
        var token = localStorage.getItem("token");
        if (token) {
            window.location.href = "/user/favorites.html";
        } else {
            window.location.href = "/user/login.html";
        }
    }

</script>
