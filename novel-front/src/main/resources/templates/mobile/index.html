<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">


    <title th:text="${application.website.name}"></title>

    <meta name="keywords" th:content="${application.website.keyword}"/>
    <meta name="description"
          th:content="${application.website.description}"/>


    <div th:include="mobile/common/css :: css"></div>

    <style>

        .line-limit-length {

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }

        .layui-nav .layui-nav-item {
            position: relative;
            display: inline-block;
            vertical-align: middle;
            line-height: 50px;
        }

        body ul.layui-nav li.layui-nav-item a {
            display: block;
            transition: all .3s;
            -webkit-transition: all .3s;
        }

        /* 顶部 Logo：等比缩放不溢出 */
        .site-header {
            padding: 10px 12px 0;
        }

        .site-logo {
            max-height: 40px;
            max-width: 140px;
        }

        /* 搜索条：胶囊输入框 + 主题色等高按钮 */
        .search-bar {
            display: -webkit-flex;
            display: flex;
            padding: 10px 12px 12px;
        }

        .search-bar input {
            -webkit-flex: 1;
            flex: 1;
            height: 40px;
            line-height: 40px;
            border: 1px solid #e2ece7;
            border-radius: 20px;
            background: #fff;
            padding: 0 15px;
            font-size: 14px;
            color: #333;
            outline: none;
            min-width: 0;
        }

        .search-bar input::-webkit-input-placeholder {
            color: #b8c4bf;
        }

        .search-bar button {
            width: 66px;
            height: 40px;
            margin-left: 8px;
            border: none;
            border-radius: 20px;
            background: #3eaf7c;
            color: #fff;
            font-size: 14px;
        }

        /* 快捷入口卡片：白底圆角浅投影 */
        .quick-entry-card {
            background: #fff;
            margin: 0 12px 12px;
            border-radius: 10px;
            padding: 14px 6px 10px;
            box-shadow: 0 2px 8px rgba(62, 175, 124, .10);
        }

        .container {
            display: flex;
            overflow-x: auto; /* 允许内容水平滚动 */
            white-space: nowrap; /* 禁止换行 */
            scroll-snap-type: x mandatory; /* 在滚动时强制对齐 snap-points */
            -ms-overflow-style: none; /* Internet Explorer 10+ */
            scrollbar-width: none; /* Firefox */
        }

        .container::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .container::-webkit-scrollbar-track,
        .container::-webkit-scrollbar-thumb {
            display: none;
        }


        .item {
            flex: 0 0 calc(100% / 10); /* 每个元素宽度为容器的十分之一 */
            scroll-snap-align: start;
            box-sizing: border-box;
            text-align: center;
            border-radius: 5px;
            margin-right: 5px;
        }

        .book_desc {
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            white-space: pre-wrap;
        }

        /* 快捷入口：上图标下文字，包裹在卡片内 */
        .quick-entry {
            display: flex;
        }

        .quick-entry .qe-item {
            flex: 1;
            display: block;
            text-align: center;
            color: #5c6b64;
        }

        .quick-entry .qe-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            margin: 0 auto 6px auto;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .10);
        }

        .quick-entry .qe-icon svg {
            width: 26px;
            height: 26px;
        }

        .quick-entry .qe-icon-lib {
            background: linear-gradient(135deg, #3eaf7c, #6cc798);
        }

        .quick-entry .qe-icon-list {
            background: linear-gradient(135deg, #ff9e57, #ffc184);
        }

        .quick-entry .qe-icon-user {
            background: linear-gradient(135deg, #5aa4f4, #8cc3ff);
        }

        .quick-entry .qe-icon-rank {
            background: linear-gradient(135deg, #ff6b81, #ff9d94);
        }

        /* 文字颜色随各自图标主色加深 */
        .quick-entry .qe-item:nth-child(1) .qe-text {
            color: #2e8b62;
        }

        .quick-entry .qe-item:nth-child(2) .qe-text {
            color: #d97b3f;
        }

        .quick-entry .qe-item:nth-child(3) .qe-text {
            color: #e05c6e;
        }

        .quick-entry .qe-item:nth-child(4) .qe-text {
            color: #4a86cc;
        }

        .quick-entry .qe-text {
            font-size: 13px;
        }

    </style>


</head>
<body>


<!-- 你的HTML代码 -->
<a name="top"></a>
<div class="site-header">
    <img class="site-logo" th:src="${application.website.logo}" alt="logo">
</div>

<div class="search-bar">
    <input id="title" type="text" placeholder="请输入书名·作者" autocomplete="off">
    <button type="button" onclick="searchBooks()">搜索</button>
</div>

<div class="quick-entry-card">
    <div class="quick-entry">
    <a href="/book/bookclass.html" class="qe-item">
        <span class="qe-icon qe-icon-lib">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
        </span>
        <span class="qe-text">书库</span>
    </a>
    <a href="/booklist/plaza.html" class="qe-item">
        <span class="qe-icon qe-icon-list">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
        </span>
        <span class="qe-text">书单</span>
    </a>
    <a href="/book/book_ranking.html" class="qe-item">
        <span class="qe-icon qe-icon-rank">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
        </span>
        <span class="qe-text">排行</span>
    </a>
    <a href="/user/userinfo.html" class="qe-item">
        <span class="qe-icon qe-icon-user">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </span>
        <span class="qe-text">个人中心</span>
    </a>
    </div>
</div>
<div class="layui-collapse layui-col-lg10">
    <div class="layui-colla-item">
        <blockquote class="layui-elem-quote" style="text-align: left;font-size: 16px">
            精品推荐
        </blockquote>

        <div class="container" style="padding-bottom: 10px">

            <div class="item" style="position: relative;padding:1%;" th:if="${bookMap['4']}" th:each="book,iterStat:${bookMap['4']}">
                <a th:href="'/book/'+${book.bookId}+'.html'">

                    <img style=" width:100px; height:125px; max-width:100%; max-height:100%;"
                         th:src="${book.picUrl}">
                    <br>
                    <span style="width: 100px" class="book_name" th:text="${book.bookName}"></span>

                </a>

            </div>
        </div>
    </div>


</div>
<div style="clear: both"></div>
<div class="layui-colla-item">
    <blockquote class="layui-elem-quote" style="text-align: left;font-size: 16px">
        热门推荐
    </blockquote>

    <div class="layui-container">
        <div class="layui-row" id="hotRecBooks" th:if="${bookMap['3']}">
            <div th:each="book,iterStat : ${bookMap['3']}" th:if="${iterStat.index<6}" style="margin-bottom: 5px"
                 class="layui-col-xs12 layui-col-sm6 layui-col-md4 layui-col-lg4">
                <a th:href="'/book/'+${book.bookId}+'.html'">
                    <div class="layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <img style=" width:100px; height:125px;" th:src="${book.picUrl}">

                    </div>
                    <div class="layui-col-xs8 layui-col-sm8 layui-col-md8 layui-col-lg8">
                        <ul>
                            <li style="padding-bottom: 5px" class="line-limit-length"
                                th:text="${book.bookName}"></li>
                            <li style="padding-bottom: 5px;color: #a6a6a6" th:text="'作者：'+${book.authorName}"></li>
                            <li class='book_desc' style="color: #a6a6a6;padding-right:10px;"
                                th:utext="${book.bookDesc}"></li>
                        </ul>
                    </div>
                    <div style="font-style: italic;color: red"
                         class="layui-col-xs2 layui-col-sm2 layui-col-md2 layui-col-lg2"></div>
                </a>
            </div>


        </div>

    </div>

</div>
<div style="clear: both"></div>
<div style="height: 1px" class="layui-col-lg1"></div>
<div class="layui-colla-item layui-col-lg10"
     style="border-width: 1px;border-style: solid;border-radius: 2px;border-top-width: 0px"><a
        href="javascript:moreNewBooks()">
    <blockquote class="layui-elem-quote" style="text-align: left;color: #000;font-size: 16px">最新更新
        <div style="float: right; margin-right: 20px"><i style="font-size: 14px;color:#666"
                                                         class="layui-icon">更多&#xe65b;</i>
        </div>
    </blockquote>
</a>
    <div class="layui-colla-content layui-show">

        <div class="layui-container" style="padding-left: 2px;padding-right: 5px">
            <div class="layui-row" id="updateRankBooks">


            </div>
        </div>

    </div>
</div>

<div style="clear: both"></div>
<div th:replace="mobile/common/footer :: footer">
</div>
<div th:replace="mobile/common/js :: js">
</div>

<script src="/mobile/js/wap_collect.js"></script>


<script>


    //更新榜单查询
    $.ajax({
        type: "get",
        url: "/book/listUpdateRank",
        data: {},
        dataType: "json",
        success: function (data) {
            if (data.code == 200) {
                var updateRankBooks = data.data;
                var updateRankBookHtml = "";
                for (var i = 0; i < updateRankBooks.length; i++) {

                    var updateRankBook = updateRankBooks[i];
                    if (updateRankBook.bookDesc) {
                        updateRankBook.bookDesc = updateRankBook.bookDesc.replace(/<[^>]+>/g, "").replace(/\s+/g, "");
                    }

                    updateRankBookHtml += ("<div style=\"padding-bottom: 30px\"\n" +
                        "                     class=\"layui-col-xs12 layui-col-sm6 layui-col-md6 layui-col-lg6\">\n" +
                        "\n" +
                        "                    <a href=\"/book/" + updateRankBook.id + ".html\">\n" +
                        "                        <div class=\"line-limit-length layui-col-xs8 layui-col-sm6 layui-col-md6 layui-col-lg6\"><span '>" + (i + 1) + "." + updateRankBook.bookName + "</span> - <span class=\"layui-elip\" style='color: #a6a6a6;'>" + updateRankBook.authorName + "</span>\n" +
                        "                        </div>\n" +
                        "                        <div class=\"layui-col-sm3 layui-col-md3 layui-col-lg3\"\n" +
                        "                             style=\"color: #FF5722;float: right;margin-right:5px\"><i>" + updateRankBook.lastIndexUpdateTime + "</i></div>\n" +
                        "\n" +
                        "                        <div style=\"clear: both\"></div>\n" +
                        "                        <div style=\"color: #a6a6a6;padding-left: 5px;padding-top: 5px\"\n" +
                        "                             class=\"layui-elip layui-col-md11 layui-col-sm11 layui-col-lg11\">简介：" + updateRankBook.bookDesc + "" +
                        "                    </div></a>\n" +
                        "                </div>");


                }
                $("#updateRankBooks").html(updateRankBookHtml);
            } else {
                layer.alert(data.msg);
            }

        }
        ,
        error: function () {
            layer.alert('网络异常');
        }
    })


    function moreNewBooks(event) {
        window.location.href = "/book/bookclass.html?sortBy=last_index_update_time";
    }

    function searchBooks() {
        var keywords = $("#title").val();
        window.location.href = "/book/bookclass.html?keyword=" + encodeURI(keywords);
    }

    // 回车触发搜索
    $("#title").keypress(function (e) {
        if (e.which == 13) {
            searchBooks();
        }
    });

    function toMyCollect() {
        var token = localStorage.getItem("token");
        if (token) {
            window.location.href = "/user/favorites.html";
        } else {
            window.location.href = "/user/login.html";
        }
    }

</script>


</body>
</html>
