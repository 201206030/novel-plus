<!DOCTYPE html>
<html>
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">


    <title th:text="${application.website.name}"></title>

    <meta name="keywords" th:content="${application.website.keyword}"/>
    <meta name="description"
          th:content="${application.website.description}"/>


    <div th:include="mobile/common/css :: css"></div>

    <style>

        .line-limit-length {

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }

        .layui-nav .layui-nav-item {
            position: relative;
            display: inline-block;
            vertical-align: middle;
            line-height: 50px;
        }

        body ul.layui-nav li.layui-nav-item a {
            display: block;
            transition: all .3s;
            -webkit-transition: all .3s;
        }

        /* 顶部 Logo：等比缩放不溢出 */
        .site-header {
            padding: 10px 12px 0;
        }

        .site-logo {
            max-height: 40px;
            max-width: 140px;
        }

        /* 搜索条：胶囊输入框 + 主题色等高按钮 */
        .search-bar {
            display: -webkit-flex;
            display: flex;
            padding: 10px 12px 12px;
        }

        .search-bar input {
            -webkit-flex: 1;
            flex: 1;
            height: 40px;
            line-height: 40px;
            border: 1px solid #e2ece7;
            border-radius: 20px;
            background: #fff;
            padding: 0 15px;
            font-size: 14px;
            color: #333;
            outline: none;
            min-width: 0;
        }

        .search-bar input::-webkit-input-placeholder {
            color: #b8c4bf;
        }

        .search-bar button {
            width: 66px;
            height: 40px;
            margin-left: 8px;
            border: none;
            border-radius: 20px;
            background: #3eaf7c;
            color: #fff;
            font-size: 14px;
        }

        /* 快捷入口卡片：白底圆角浅投影 */
        .quick-entry-card {
            background: #fff;
            margin: 0 12px 12px;
            border-radius: 10px;
            padding: 14px 6px 10px;
            box-shadow: 0 2px 8px rgba(62, 175, 124, .10);
        }

        /* 区块卡片 */
        .sec-block {
            background: #fff;
            border-radius: 10px;
            padding: 14px;
            margin: 0 12px 12px;
            box-shadow: 0 2px 8px rgba(62, 175, 124, .08);
        }

        .sec-title {
            font-size: 16px;
            font-weight: 600;
            color: #1f2d26;
            line-height: 20px;
            margin-bottom: 12px;
        }

        .sec-title:before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 16px;
            background: #3eaf7c;
            border-radius: 2px;
            margin-right: 8px;
            vertical-align: -2px;
        }

        /* 「更多」胶囊按钮：仅作用于链接自身 */
        .sec-title .sec-more {
            float: right;
            font-size: 12px;
            font-weight: normal;
            color: #2e8b62;
            background: rgba(62, 175, 124, .08);
            border-radius: 12px;
            padding: 2px 10px;
        }

        .sec-title .sec-more .layui-icon {
            font-size: 12px;
            margin-left: 2px;
        }

        a.sec-title {
            display: block;
            color: #1f2d26;
        }

        /* 按压反馈 */
        a.sec-title:active .sec-more {
            background: rgba(62, 175, 124, .18);
        }

        /* 精品推荐：横向滚动封面条 */
        .rec-scroll {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .rec-scroll::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .rec-item {
            flex: 0 0 auto;
            width: 90px;
            text-align: center;
            margin-right: 10px;
        }

        .rec-item:last-child {
            margin-right: 0;
        }

        .rec-item .rec-cover {
            width: 90px;
            height: 118px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .08);
        }

        .rec-item .rec-name {
            margin-top: 6px;
            font-size: 12px;
            color: #5c6b64;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 书籍卡片（热门推荐） */
        .book-card {
            display: -webkit-flex;
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid #f5f7f6;
        }

        .book-card:first-child {
            padding-top: 0;
        }

        .book-card:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .book-card .book-cover img {
            width: 88px;
            height: 116px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        .book-card .book-info {
            -webkit-flex: 1;
            flex: 1;
            min-width: 0;
            margin-left: 12px;
        }

        .book-card .book-name {
            color: #000;
            font-size: 15px;
            font-weight: 600;
            line-height: 22px;
        }

        .book-card .book-author {
            margin-top: 4px;
            font-size: 12px;
            color: #98a8a1;
        }

        /* 更新日期榜列表 */
        .ur-item {
            display: -webkit-flex;
            display: flex;
            -webkit-align-items: center;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid #f5f7f6;
        }

        .ur-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .ur-item:first-child {
            padding-top: 0;
        }

        .ur-num {
            flex: 0 0 auto;
            -webkit-flex: 0 0 auto;
            width: 20px;
            text-align: center;
            font-size: 14px;
            font-style: italic;
            font-weight: 700;
            color: #c0cac5;
        }

        .ur-num-1 {
            color: #e05c6e;
        }

        .ur-num-2 {
            color: #ff9e57;
        }

        .ur-num-3 {
            color: #3eaf7c;
        }

        .ur-info {
            -webkit-flex: 1;
            flex: 1;
            min-width: 0;
            margin-left: 8px;
        }

        .ur-top {
            display: block;
            font-size: 14px;
            color: #333;
        }

        .ur-top .ur-author {
            font-size: 12px;
            color: #98a8a1;
            margin-left: 8px;
        }

        .ur-sub {
            margin-top: 3px;
            font-size: 12px;
            color: #b8c4bf;
        }

        .ur-time {
            flex: 0 0 auto;
            -webkit-flex: 0 0 auto;
            font-size: 12px;
            color: #b8c4bf;
            margin-left: 10px;
        }

        .book_desc {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: pre-wrap;
            margin-top: 4px;
            font-size: 12px;
            line-height: 18px;
            color: #98a8a1;
        }

        /* 快捷入口：上图标下文字，包裹在卡片内 */
        .quick-entry {
            display: flex;
        }

        .quick-entry .qe-item {
            flex: 1;
            display: block;
            text-align: center;
            color: #5c6b64;
        }

        .quick-entry .qe-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            margin: 0 auto 6px auto;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .10);
        }

        .quick-entry .qe-icon svg {
            width: 26px;
            height: 26px;
        }

        .quick-entry .qe-icon-lib {
            background: linear-gradient(135deg, #3eaf7c, #6cc798);
        }

        .quick-entry .qe-icon-list {
            background: linear-gradient(135deg, #ff9e57, #ffc184);
        }

        .quick-entry .qe-icon-user {
            background: linear-gradient(135deg, #5aa4f4, #8cc3ff);
        }

        .quick-entry .qe-icon-rank {
            background: linear-gradient(135deg, #ff6b81, #ff9d94);
        }

        /* 文字颜色随各自图标主色加深 */
        .quick-entry .qe-item:nth-child(1) .qe-text {
            color: #2e8b62;
        }

        .quick-entry .qe-item:nth-child(2) .qe-text {
            color: #d97b3f;
        }

        .quick-entry .qe-item:nth-child(3) .qe-text {
            color: #e05c6e;
        }

        .quick-entry .qe-item:nth-child(4) .qe-text {
            color: #4a86cc;
        }

        .quick-entry .qe-text {
            font-size: 13px;
        }

    </style>


</head>
<body>


<!-- 你的HTML代码 -->
<a name="top"></a>
<div class="site-header">
    <img class="site-logo" th:src="${application.website.logo}" alt="logo">
</div>

<div class="search-bar">
    <input id="title" type="text" placeholder="请输入书名·作者" autocomplete="off">
    <button type="button" onclick="searchBooks()">搜索</button>
</div>

<div class="quick-entry-card">
    <div class="quick-entry">
    <a href="/book/bookclass.html" class="qe-item">
        <span class="qe-icon qe-icon-lib">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
        </span>
        <span class="qe-text">书库</span>
    </a>
    <a href="/booklist/plaza.html" class="qe-item">
        <span class="qe-icon qe-icon-list">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
        </span>
        <span class="qe-text">书单</span>
    </a>
    <a href="/book/book_ranking.html" class="qe-item">
        <span class="qe-icon qe-icon-rank">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
        </span>
        <span class="qe-text">排行</span>
    </a>
    <a href="/user/userinfo.html" class="qe-item">
        <span class="qe-icon qe-icon-user">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </span>
        <span class="qe-text">个人中心</span>
    </a>
    </div>
</div>
<div class="sec-block">
    <div class="sec-title">精品推荐</div>

    <div class="rec-scroll" th:if="${bookMap['4']}">
        <div class="rec-item" th:each="book,iterStat:${bookMap['4']}">
            <a th:href="'/book/'+${book.bookId}+'.html'">
                <img class="rec-cover" th:src="${book.picUrl}" alt="">
                <div class="rec-name" th:text="${book.bookName}"></div>
            </a>
        </div>
    </div>
</div>

<div class="sec-block">
    <div class="sec-title">热门推荐</div>

    <div id="hotRecBooks" th:if="${bookMap['3']}">
        <div class="book-card" th:each="book,iterStat : ${bookMap['3']}" th:if="${iterStat.index<6}">
            <a class="book-cover" th:href="'/book/'+${book.bookId}+'.html'">
                <img th:src="${book.picUrl}" alt="">
            </a>
            <div class="book-info">
                <a th:href="'/book/'+${book.bookId}+'.html'">
                    <div class="book-name line-limit-length" th:text="${book.bookName}"></div>
                </a>
                <div class="book-author line-limit-length" th:text="'作者：'+${book.authorName}"></div>
                <div class="book_desc" th:utext="${book.bookDesc}"></div>
            </div>
        </div>
    </div>
</div>

<div class="sec-block">
    <a class="sec-title" href="javascript:moreNewBooks()">最新更新<span class="sec-more">更多</span></a>
    <div id="updateRankBooks"></div>
</div>

<div th:replace="mobile/common/footer :: footer">
</div>
<div th:replace="mobile/common/js :: js">
</div>

<script src="/mobile/js/wap_collect.js"></script>


<script>


    //更新榜单查询
    $.ajax({
        type: "get",
        url: "/book/listUpdateRank",
        data: {},
        dataType: "json",
        success: function (data) {
            if (data.code == 200) {
                var updateRankBooks = data.data;
                var updateRankBookHtml = "";
                for (var i = 0; i < updateRankBooks.length; i++) {

                    var updateRankBook = updateRankBooks[i];
                    if (updateRankBook.bookDesc) {
                        updateRankBook.bookDesc = updateRankBook.bookDesc.replace(/<[^>]+>/g, "").replace(/\s+/g, "");
                    }

                    updateRankBookHtml += ("<div class=\"ur-item\">\n" +
                        "        <span class=\"ur-num" + (i < 3 ? " ur-num-" + (i + 1) : "") + "\">" + (i + 1) + "</span>\n" +
                        "        <div class=\"ur-info\">\n" +
                        "            <a class=\"ur-top line-limit-length\" href=\"/book/" + updateRankBook.id + ".html\">" + updateRankBook.bookName + "<span class=\"ur-author\">" + updateRankBook.authorName + "</span></a>\n" +
                        "            <div class=\"ur-sub line-limit-length\">" + (updateRankBook.bookDesc || "") + "</div>\n" +
                        "        </div>\n" +
                        "        <span class=\"ur-time\">" + updateRankBook.lastIndexUpdateTime.substr(0, 11) + "</span>\n" +
                        "    </div>");


                }
                $("#updateRankBooks").html(updateRankBookHtml);
            } else {
                layer.alert(data.msg);
            }

        }
        ,
        error: function () {
            layer.alert('网络异常');
        }
    })


    function moreNewBooks(event) {
        window.location.href = "/book/bookclass.html?sortBy=last_index_update_time";
    }

    function searchBooks() {
        var keywords = $("#title").val();
        window.location.href = "/book/bookclass.html?keyword=" + encodeURI(keywords);
    }

    // 回车触发搜索
    $("#title").keypress(function (e) {
        if (e.which == 13) {
            searchBooks();
        }
    });

    function toMyCollect() {
        var token = localStorage.getItem("token");
        if (token) {
            window.location.href = "/user/favorites.html";
        } else {
            window.location.href = "/user/login.html";
        }
    }

</script>


</body>
</html>
