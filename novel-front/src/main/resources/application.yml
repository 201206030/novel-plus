server:
  port: 8083

spring:
  profiles:
    active: dev
    include: website,alipay,oss

jwt:
  secret: ${JWT_SECRET:}
  expiration: 604800

#缓存管理密码
cache:
  manager:
    password: novel@2020117


# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接 （多个用逗号分隔）
  urlPatterns: /book/addCommentReply,/book/addBookComment,/book/addParagraphComment,/user/addFeedBack,/author/addBook,/author/addBookContent,/author/updateBookContent,/author/register.html,/bookList/create,/bookList/update,/bookList/addBook,/author/aiAssistant/saveParams,/author/aiAssistant/savePlanContent,/author/aiAssistant/confirmPlan,/author/aiAssistant/updateChapterPlan,/author/aiAssistant/saveDraft,/author/aiAssistant/saveChapter,/author/aiAssistant/savePref


author:
  income:
    #税率(扣税后所得比率)
    tax-rate: 0.9
    #分佣比例
    share-proportion: 0.7
    #兑换比率(人民币)
    exchange-proportion: 0.01

#小说章节定价规则
book:
  price:
    #字数
    word-count: 1000
    #价值(屋币)
    value: 5

# AI 创作接口防护（鉴权 + 额度限流 + 参数上限），详见 AiApiRateLimitProperties
novel:
  ai:
    rate-limit:
      # 限流总开关，关闭后仍保留登录/作家身份与参数校验
      enabled: true
      # 单用户每分钟点数
      per-minute: 20
      # 单用户每天点数
      per-day: 300
      # 全站每分钟点数（防止多账号同时刷额度）
      global-per-minute: 200
      # 单次输入文本最大字符数
      max-text-length: 5000
      # 扩写倍数上限（百分比）
      max-expand-ratio: 400
      # 缩写比例上限（100/ratio 分之一）
      max-condense-ratio: 100
      # 续写目标字数上限
      max-continue-length: 3000
      # 每多少字符折算 1 点
      cost-per-chars: 500
      # 单次请求最多折算点数
      max-cost-per-request: 20
      # 不消耗额度的 AI 助手接口（含 2.5 秒一次的任务轮询）单用户每分钟上限
      light-per-minute: 120
      # 提交一次异步生成任务消耗点数
      task-cost: 10
      # 保存章节（会间接触发 AI 摘要任务）消耗点数
      summary-cost: 2
      # AI 助手长文本参数（正文/方案/偏好等）最大字符数
      max-content-length: 200000


