<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>订单列表-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    var CHANNEL_MAP = {1: '支付宝', 2: '微信'};
    var PAY_STATUS_MAP = {0: '支付失败', 1: '支付成功', 2: '待支付'};

    Admin.crud({
        api: '/order/pay',
        title: '支付订单列表',
        searchPlaceholder: '输入订单号搜索',
        hasAdd: false,
        hasEdit: false,
        hasDel: false,
        columns: [
            {title: '商户订单号', field: 'outTradeNo'},
            {title: '平台交易号', field: 'tradeNo', thClass: 'time'},
            {title: '下单用户', field: 'userName', thClass: 'time'},
            {title: '支付渠道', thClass: 'time', render: function (row) {
                return CHANNEL_MAP[row.payChannel] || row.payChannel;
            }},
            {title: '金额', thClass: 'time', render: function (row) {
                return (row.totalAmount || 0) + ' 元';
            }},
            {title: '支付状态', thClass: 'time', render: function (row) {
                return PAY_STATUS_MAP[row.payStatus] || row.payStatus;
            }},
            {title: '创建时间', thClass: 'col_time', render: function (row) {
                return Admin.fmt(row.createTime);
            }}
        ]
    });
</script>
</html>
