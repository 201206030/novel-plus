<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>购买记录-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    // 支持从会员列表带 userId 进入，只看单个会员的购买流水
    var userId = Admin.q('userId');
    Admin.crud({
        api: '/member/buyRecord',
        title: '购买记录' + (userId ? '（会员 #' + userId + '）' : ''),
        searchPlaceholder: '输入用户名/昵称/书名/章节名搜索',
        selectable: false,
        hasAdd: false,
        hasEdit: false,
        hasDel: false,
        backUrl: userId ? '/member/user.html' : '',
        params: userId ? {userId: userId} : {},
        columns: [
            {title: '购买用户', field: 'userName', thClass: 'time'},
            {title: '小说', field: 'bookName', thClass: 'col_ell', ellipsis: true},
            {title: '章节', field: 'bookIndexName', thClass: 'col_book', ellipsis: true},
            {title: '消耗书币', thClass: 'col_num', render: function (row) {
                return (row.buyAmount || 0) + ' 书币';
            }},
            {title: '购买时间', thClass: 'col_time', render: function (row) {
                return Admin.fmt(row.createTime);
            }}
        ]
    });
</script>
</html>
