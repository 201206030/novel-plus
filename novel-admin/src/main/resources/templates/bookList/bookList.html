<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>书单管理-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    Admin.crud({
        api: '/bookList/bookList',
        title: '书单管理',
        searchPlaceholder: '输入书单名搜索',
        selectable: true,
        addBtnText: '新建书单',
        columns: [
            {title: '书单名', field: 'listName'},
            {title: '创建用户', field: 'userName', thClass: 'time'},
            {title: '书籍数量', thClass: 'col_num', render: function (row) {
                return row.bookCount || 0;
            }},
            {title: '简介', field: 'description'},
            {title: '状态', thClass: 'time', render: function (row) {
                return row.status == 1 ? '正常' : '已删除';
            }},
            {title: '创建时间', thClass: 'col_time', render: function (row) {
                return Admin.fmt(row.createTime);
            }}
        ],
        rowActions: [
            {title: '明细', fn: function (row) {
                location.href = '/bookList/bookListItem.html?listId=' + row.id;
            }}
        ],
        fields: [
            {name: 'listName', label: '书单名', required: true},
            {name: 'userId', label: '创建用户', type: 'remote', url: '/bookList/bookList/users',
                labelFields: 'nickName,username', searchLabel: '用户名/昵称', required: true,
                tip: '列表展示最近注册的50个用户，可输入关键字回车检索'},
            {name: 'description', label: '书单简介', type: 'textarea'}
        ]
    });
</script>
</html>
