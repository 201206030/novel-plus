<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>书单明细-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    var listId = Admin.q('listId');

    Admin.crud({
        api: '/bookList/bookList',
        title: '书单明细',
        searchKey: false,
        selectable: false,
        inlineEdit: true,
        hasDel: true,
        addBtnText: '添加书籍',
        backUrl: '/bookList/bookList.html',
        params: {listId: listId},
        listUrl: '/bookList/item/list',
        saveUrl: '/bookList/item/save',
        updateUrl: '/bookList/item/update',
        removeUrl: '/bookList/item/remove',
        columns: [
            {title: '书籍名称', field: 'bookName'},
            {title: '推荐理由', field: 'remark'},
            {title: '添加时间', thClass: 'col_time', render: function (row) {
                return Admin.fmt(row.createTime);
            }}
        ],
        fields: [
            {name: 'listId', type: 'hidden'},
            {name: 'bookId', label: '选择书籍', type: 'remote', url: '/website/bookSetting/books',
                labelFields: 'bookName,authorName', searchLabel: '书名', required: true, addOnly: true,
                tip: '列表展示最近更新的50本，可输入关键字检索'},
            {name: 'remark', label: '推荐理由', type: 'textarea'}
        ]
    });
</script>
</html>
