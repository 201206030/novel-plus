<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>段评管理-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    Admin.crud({
        api: '/comment/paragraph',
        title: '段评管理',
        searchPlaceholder: '输入小说名精确搜索',
        selectable: true,
        hasAdd: false,
        hasEdit: false,
        columns: [
            {title: '小说名称', field: 'bookName', thClass: 'time'},
            {title: '章节', field: 'indexName', thClass: 'time'},
            {title: '段落序号', thClass: 'col_num', render: function (row) {
                return row.paragraphIdx;
            }},
            {title: '评论用户', field: 'createUserName', thClass: 'time'},
            {title: '段评内容', field: 'commentContent'},
            {title: '回复数', thClass: 'col_num', render: function (row) {
                return row.replyCount || 0;
            }},
            {title: '发布时间', thClass: 'col_time', render: function (row) {
                return Admin.fmt(row.createTime);
            }}
        ]
    });
</script>
</html>
