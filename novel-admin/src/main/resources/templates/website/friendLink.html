<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>友情链接-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    Admin.crud({
        api: '/website/friendLink',
        title: '友情链接列表',
        searchPlaceholder: '输入链接名称搜索',
        selectable: true,
        addBtnText: '新增链接',
        columns: [
            {title: '链接名称', field: 'linkName'},
            {title: '链接地址', field: 'linkUrl', render: function (row) {
                return '<a href="' + Admin.escape(row.linkUrl) + '" target="_blank">' + Admin.escape(row.linkUrl) + '</a>';
            }},
            {title: '排序号', field: 'sort', thClass: 'col_num'},
            {title: '状态', thClass: 'time', render: function (row) {
                return row.isOpen == 1 ? '开启' : '不开启';
            }},
            {title: '创建时间', thClass: 'col_time', render: function (row) {
                return Admin.fmt(row.createTime);
            }}
        ],
        fields: [
            {name: 'linkName', label: '链接名称', required: true},
            {name: 'linkUrl', label: '链接地址', required: true, placeholder: 'https://...'},
            {name: 'sort', label: '排序号', type: 'number', defaultValue: 11},
            {name: 'isOpen', label: '是否开启', type: 'select', options: [[1, '开启'], [0, '不开启']], defaultValue: 1}
        ]
    });
</script>
</html>
