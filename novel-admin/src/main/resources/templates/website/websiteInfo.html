<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>网站信息-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div class="title cf"><h2 class="fl">网站信息设置</h2></div>
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    Admin.formPage({
        getUrl: '/website/websiteInfo/get',
        saveUrl: '/website/websiteInfo/update',
        saveTip: '保存成功，请重启 novel-front 生效',
        fields: [
            {name: 'id', type: 'hidden'},
            {name: 'name', label: '网站名称', required: true},
            {name: 'domain', label: '网站域名', required: true},
            {name: 'keyword', label: 'SEO关键字', required: true},
            {name: 'description', label: 'SEO描述', type: 'textarea', required: true},
            {name: 'qq', label: 'QQ客服', required: true},
            {name: 'logo', label: '网站LOGO', required: true},
            {name: 'logoDark', label: 'LOGO(深色)', required: true}
        ]
    });
</script>
</html>
