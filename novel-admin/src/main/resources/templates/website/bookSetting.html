<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>小说推荐-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    var TYPE_MAP = {0: '轮播图', 1: '顶部小说栏', 2: '本周强推', 3: '热门推荐', 4: '精品推荐'};

    Admin.crud({
        api: '/website/bookSetting',
        title: '首页小说设置',
        searchKey: false,
        selectable: false,
        hasAdd: false,
        hasDel: false,
        filters: [
            {param: 'type', label: '类型', options: [[0, '轮播图'], [1, '顶部小说栏'], [2, '本周强推'], [3, '热门推荐'], [4, '精品推荐']]}
        ],
        columns: [
            {title: '小说名称', field: 'bookName', thClass: 'col_book', ellipsis: true},
            {title: '作者', field: 'authorName', thClass: 'time'},
            {title: '类型', thClass: 'time', render: function (row) {
                return TYPE_MAP[row.type] || row.type;
            }},
            {title: '排序号', field: 'sort', thClass: 'col_num'},
            {title: '创建时间', thClass: 'col_time', render: function (row) {
                return Admin.fmt(row.createTime);
            }}
        ],
        fields: [
            {name: 'bookId', label: '选择小说', type: 'remote', url: '/website/bookSetting/books',
                labelFields: 'bookName,authorName', searchLabel: '书名', required: true,
                tip: '列表展示最近更新的50本，可输入关键字检索'},
            {name: 'type', label: '推荐类型', type: 'select', required: true, lockOnEdit: true,
                options: [[0, '轮播图'], [1, '顶部小说栏'], [2, '本周强推'], [3, '热门推荐'], [4, '精品推荐']]},
            {name: 'sort', label: '排序号', type: 'number'}
        ]
    });
</script>
</html>
