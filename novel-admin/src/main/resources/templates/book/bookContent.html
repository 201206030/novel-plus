<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>章节内容-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div class="title cf">
                    <h2 class="fl">章节内容编辑</h2>
                    <div class="fr"><a href="javascript:history.back()" class="btn_red">返 回</a></div>
                </div>
                <div class="a_detail">
                    <textarea id="content" placeholder="加载中..."></textarea>
                    <div class="detail_btns">
                        <a href="javascript:;" class="layui-btn" id="saveBtn">保存内容</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    var indexId = Admin.q('indexId');
    if (!indexId) {
        layer.alert('缺少章节参数');
    } else {
        Admin.get('/book/bookContent/get', {indexId: indexId}, function (data) {
            $('#content').val(data && data.content ? data.content : '');
        });
    }

    $('#saveBtn').click(function () {
        var content = $('#content').val();
        if ($.trim(content) === '') {
            layer.alert('内容不能为空');
            return;
        }
        $('#saveBtn').addClass('layui-btn-disabled');
        Admin.post('/book/bookContent/save', {indexId: indexId, content: content}, function () {
            layer.msg('保存成功');
            $('#saveBtn').removeClass('layui-btn-disabled');
        });
    });
</script>
</html>
