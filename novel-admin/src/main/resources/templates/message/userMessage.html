<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>消息管理-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    var MSG_TYPE_MAP = {1: '书评被回复', 2: '段评被回复', 3: '系统通知'};

    Admin.crud({
        api: '/message/userMessage',
        saveUrl: '/message/userMessage/send',
        title: '消息管理',
        searchKey: false,
        hasEdit: false,
        hasDel: false,
        addBtnText: '发送消息',
        formHeight: '480px',
        filters: [
            {param: 'msgType', label: '类型', options: [[1, '书评回复'], [2, '段评回复'], [3, '系统通知']]},
            {param: 'readFlag', label: '已读', options: [[0, '未读'], [1, '已读']]}
        ],
        columns: [
            {title: '接收用户', field: 'receiveUserName', thClass: 'time'},
            {title: '发送用户', field: 'sendUserName', thClass: 'time'},
            {title: '消息内容', field: 'content'},
            {title: '类型', thClass: 'time', render: function (row) {
                return MSG_TYPE_MAP[row.msgType] || row.msgType;
            }},
            {title: '关联小说', field: 'bookName', thClass: 'time'},
            {title: '已读状态', thClass: 'time', render: function (row) {
                return row.readFlag == 1 ? '已读' : '未读';
            }},
            {title: '发送时间', thClass: 'col_time', render: function (row) {
                return Admin.fmt(row.createTime);
            }}
        ],
        fields: [
            {name: 'userId', label: '接收用户', type: 'remote', url: '/bookList/bookList/users',
                labelFields: 'nickName,username', searchLabel: '用户名/昵称', required: true,
                tip: '列表展示最近注册的50个用户，可输入关键字回车检索'},
            {name: 'content', label: '消息内容', type: 'textarea', required: true}
        ]
    });
</script>
</html>
