<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>系统用户管理-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    Admin.crud({
        api: '/sys/user',
        title: '系统用户管理（后台登录账号）',
        searchPlaceholder: '输入用户名/姓名/邮箱/手机号搜索',
        selectable: true,
        // 单条删除走 /sys/user/remove（传 id）；之前误指向 batchRemove（要 ids）导致删除报参数缺失
        removeUrl: '/sys/user/remove',
        batchRemoveUrl: '/sys/user/batchRemove',
        // admin 为系统内置账号，整行锁定：不显示修改/启停/删除/分配角色，也不给勾选框；
        // 其密码由该账号本人用右上角「修改密码」自助修改
        lockRow: function (row) { return row.username === 'admin'; },
        lockText: '系统内置账号，不可操作（改密码请用右上角「修改密码」）',
        columns: [
            {title: '用户名', field: 'username', thClass: 'col_ell', ellipsis: true},
            {title: '姓名', thClass: 'col_ell', ellipsis: true},
            {title: '邮箱', thClass: 'col_ell', ellipsis: true},
            {title: '手机号', thClass: 'time'},
            {title: '角色', thClass: 'col_ell', field: 'roleNames', ellipsis: true, render: function (row) {
                return row.roleNames ? Admin.escape(row.roleNames) : '<span style="color:#999">未分配</span>';
            }},
            {title: '状态', thClass: 'time', render: function (row) {
                return row.status == 0 ? '<span style="color:#FF5722">禁用</span>' : '<span style="color:#5FB878">正常</span>';
            }},
            {title: '创建时间', thClass: 'col_time', render: function (row) {
                return Admin.fmt(row.gmtCreate);
            }}
        ],
        filters: [
            {param: 'status', label: '状态', options: [['1', '正常'], ['0', '禁用']]}
        ],
        fields: [
            {name: 'username', label: '用户名', required: true, lockOnEdit: true},
            {name: 'name', label: '姓名'},
            {name: 'password', label: '密码', tip: '新增必填且至少6位；编辑时留空表示不修改密码'},
            {name: 'email', label: '邮箱'},
            {name: 'mobile', label: '手机号'},
            {name: 'status', label: '状态', type: 'select', options: [['1', '正常'], ['0', '禁用']], defaultValue: '1',
                tip: '禁用的账号无法登录后台；角色标识含 admin 的账号为超级管理员'}
        ],
        rowActions: [
            {title: '禁用', cls: 'a_action_red', show: function (row) { return row.status != 0; }, fn: function (row) {
                layer.confirm('确定禁用用户「' + row.username + '」吗？', {icon: 3, title: '提示'}, function (idx) {
                    layer.close(idx);
                    Admin.post('/sys/user/status', {id: row.id, status: 0}, function () {
                        layer.msg('已禁用');
                        Admin.refresh();
                    });
                });
            }},
            {title: '启用', show: function (row) { return row.status == 0; }, fn: function (row) {
                layer.confirm('确定启用用户「' + row.username + '」吗？', {icon: 3, title: '提示'}, function (idx) {
                    layer.close(idx);
                    Admin.post('/sys/user/status', {id: row.id, status: 1}, function () {
                        layer.msg('已启用');
                        Admin.refresh();
                    });
                });
            }},
            {title: '分配角色', fn: function (row) {
                showAssignRoles(row);
            }}
        ]
    });

    // 分配角色弹窗：勾选该用户的角色
    function showAssignRoles(row) {
        Admin.get('/sys/user/roles', {id: row.id}, function (data) {
            var roles = data.roles || [], checked = data.checked || [];
            var html = '<div style="padding:16px 20px;">';
            if (roles.length === 0) {
                html += '暂无角色，请先到「角色管理」新增。</div>';
                layer.open({type: 1, title: '分配角色 - ' + Admin.escape(row.username), area: ['360px', '180px'], content: html});
                return;
            }
            for (var i = 0; i < roles.length; i++) {
                var on = false;
                for (var j = 0; j < checked.length; j++) {
                    if (String(checked[j]) === String(roles[i].id)) { on = true; break; }
                }
                html += '<label style="display:block;margin-bottom:8px;cursor:pointer;">'
                    + '<input type="checkbox" class="a_role_chk" value="' + roles[i].id + '"' + (on ? ' checked' : '') + '/> '
                    + Admin.escape(roles[i].roleName) + ' <span style="color:#999">(' + Admin.escape(roles[i].roleSign || '') + ')</span></label>';
            }
            html += '</div>';
            layer.open({
                type: 1,
                title: '分配角色 - ' + Admin.escape(row.username),
                area: ['420px', '400px'],
                content: html,
                btn: ['保存', '取消'],
                yes: function (idx) {
                    var ids = [];
                    // layer type:1 弹层的 DOM id 约定为 layui-layer-{index}
                    $('#layui-layer' + idx).find('.a_role_chk:checked').each(function () { ids.push($(this).val()); });
                    Admin.post('/sys/user/assignRoles', {userId: row.id, roleIds: ids.join(',')}, function () {
                        layer.close(idx);
                        layer.msg('分配成功');
                        Admin.refresh();
                    });
                }
            });
        });
    }
</script>
</html>
