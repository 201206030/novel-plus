<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>权限管理-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    // 权限只分两级：目录 + 菜单（页面）。勾中菜单即拥有该页面的一切操作，不再提供按钮级
    var TYPE_NAME = {0: '目录', 1: '菜单'};
    var TYPE_COLOR = {0: '#4a90d9', 1: '#3eaf7c'};

    Admin.crud({
        api: '/sys/menu',
        title: '权限管理（菜单）',
        searchPlaceholder: '输入菜单名称/权限标识搜索',
        selectable: false,
        // 权限管理只读：菜单/目录结构由 doc/sql 脚本统一维护，页面不提供新增/修改/删除
        hasAdd: false,
        hasEdit: false,
        hasDel: false,
        formWidth: '640px',
        columns: [
            {title: '菜单名称', field: 'name', thClass: 'col_ell', ellipsis: true},
            {title: '类型', thClass: 'time', render: function (row) {
                return '<span style="color:' + (TYPE_COLOR[row.type] || '#666') + '">' + (TYPE_NAME[row.type] || '未知') + '</span>';
            }},
            {title: '父菜单', thClass: 'col_ell', ellipsis: true, render: function (row) {
                return row.parentId == 0 ? '<span style="color:#999">一级菜单</span>' : Admin.escape(row.parentName || ('ID:' + row.parentId));
            }},
            {title: '路由地址', thClass: 'col_ell', field: 'url', ellipsis: true},
            {title: '权限标识', thClass: 'col_ell', field: 'perms', ellipsis: true},
            {title: '排序', thClass: 'time', render: function (row) {
                return row.orderNum == null ? 0 : row.orderNum;
            }}
        ]
        // 只读页：不配置 fields/rowActions，操作列整列隐藏
    });
</script>
</html>
