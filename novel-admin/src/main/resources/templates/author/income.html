<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>作家收入-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    // 金额单位：分 → 元，保留2位小数
    function yuan(fen) {
        return '¥' + (((Number(fen) || 0) / 100).toFixed(2));
    }

    function settleIncome(row) {
        layer.confirm('确定结算「' + (row.penName || '') + '」' + monthText(row) + '《' + (row.bookName || '') + '》的稿费（税后 ' + yuan(row.afterTaxIncome) + '）吗？', {icon: 3, title: '提示'}, function (idx) {
            layer.close(idx);
            Admin.post('/author/income/settle', {id: row.id}, function () {
                layer.msg('结算成功');
                Admin.refresh();
            });
        });
    }

    function monthText(row) {
        return row.incomeMonth ? Admin.fmt(row.incomeMonth).substring(0, 7) + ' 收入：' : '';
    }

    Admin.crud({
        api: '/author/income',
        listUrl: '/author/income/list',
        title: '作家收入管理',
        searchPlaceholder: '输入书名/笔名搜索',
        hasAdd: false,
        hasEdit: false,
        hasDel: false,
        filters: [
            {param: 'payStatus', label: '结算状态', options: [['0', '待结算'], ['1', '已结算']]}
        ],
        toolbar: '<a href="javascript:;" class="layui-btn layui-btn-sm layui-btn-normal" id="aSettleAllBtn">一键结算全部待结算</a>',
        columns: [
            {title: '笔名', field: 'penName', thClass: 'col_ell', ellipsis: true},
            {title: '作品', field: 'bookName', thClass: 'col_book', ellipsis: true},
            {title: '收入月份', render: function (row) {
                return row.incomeMonth ? Admin.fmt(row.incomeMonth).substring(0, 7) : '-';
            }},
            {title: '税前收入', render: function (row) {
                return yuan(row.preTaxIncome);
            }},
            {title: '税后收入', render: function (row) {
                return yuan(row.afterTaxIncome);
            }},
            {title: '结算状态', thClass: 'time', render: function (row) {
                return row.payStatus == 1 ? '<span style="color:#5FB878">已结算</span>' : '<span style="color:#FFB800">待结算</span>';
            }}
        ],
        rowActions: [
            {title: '结算', show: function (row) { return row.payStatus != 1; }, fn: function (row) { settleIncome(row); }}
        ]
    });

    // 工具栏按钮由框架异步渲染，用事件委托绑定
    $(document).on('click', '#aSettleAllBtn', function () {
        layer.confirm('确定要将所有“待结算”的稿费一键结算吗？结算后作家端将显示为已支付。', {icon: 3, title: '提示'}, function (idx) {
            layer.close(idx);
            Admin.post('/author/income/settleAll', {}, function (count) {
                layer.msg('结算完成，本次共结算 ' + (count || 0) + ' 条记录');
                Admin.refresh();
            });
        });
    });
</script>
</html>
