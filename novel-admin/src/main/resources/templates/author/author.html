<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>作者列表-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    // 封禁/解禁作者（status：0正常 1封禁）
    function changeAuthorStatus(row, to) {
        var name = to == 1 ? '封禁' : '解禁';
        layer.confirm('确定要' + name + '作者「' + (row.penName || '') + '」吗？', {icon: 3, title: '提示'}, function (idx) {
            layer.close(idx);
            Admin.post('/author/author/status', {id: row.id, status: to}, function () {
                layer.msg(name + '成功');
                Admin.refresh();
            });
        });
    }

    Admin.crud({
        api: '/author/author',
        title: '作者列表',
        searchPlaceholder: '输入笔名/手机号搜索',
        selectable: false,
        hasAdd: false,
        hasEdit: false,
        hasDel: false,
        rowActions: [
            {title: '封禁', show: function (row) { return row.status == 0; }, fn: function (row) { changeAuthorStatus(row, 1); }},
            {title: '解禁', show: function (row) { return row.status != 0; }, fn: function (row) { changeAuthorStatus(row, 0); }}
        ],
        columns: [
            {title: '笔名', field: 'penName', thClass: 'col_ell', ellipsis: true},
            {title: '联系手机', field: 'telPhone', thClass: 'time'},
            {title: '即时通讯', field: 'chatAccount', thClass: 'col_ell', ellipsis: true},
            {title: '邮箱', field: 'email', thClass: 'col_book', ellipsis: true},
            {title: '作品方向', thClass: 'time', render: function (row) {
                return row.workDirection == 1 ? '女频' : '男频';
            }},
            {title: '邀请码', field: 'inviteCode', thClass: 'time'},
            {title: '状态', thClass: 'time', render: function (row) {
                return row.status == 0 ? '正常' : '封禁';
            }},
            {title: '注册时间', thClass: 'col_time', render: function (row) {
                return Admin.fmt(row.createTime);
            }}
        ]
    });
</script>
</html>
