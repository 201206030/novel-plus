<div th:fragment="header" class="adm_header">
    <div class="adm_header_in">
        <a class="adm_header_logo" href="/">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span id="admSiteName">小说精品屋后台管理</span>
        </a>
        <div class="adm_header_right">
            <a class="adm_header_btn" id="frontSiteLink" href="javascript:;" target="_blank" rel="noopener" style="display:none">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <path d="M15 3h6v6"></path>
                    <path d="M10 14L21 3"></path>
                </svg>
                前台站点
            </a>
            <span class="adm_header_user">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                管理员
            </span>
            <a class="adm_header_btn adm_header_logout" id="logoutBtn" href="javascript:;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <path d="M16 17l5-5-5-5"></path>
                    <path d="M21 12H9"></path>
                </svg>
                退出
            </a>
        </div>
    </div>
    <!-- Spring Security 的 /logout 仅接受 POST，用隐藏表单提交（csrf 已全局禁用） -->
    <form id="logoutForm" action="/logout" method="post" style="display:none"></form>
    <script>
        // 头部不依赖 jQuery（各页面 jQuery 在 body 末尾才加载），用原生 ES5 实现
        (function () {
            // 站点名与前台地址取自网站信息，失败/未配置时保持默认文案
            if (window.fetch) {
                fetch('/website/websiteInfo/get').then(function (r) {
                    return r.json();
                }).then(function (res) {
                    if (!res || res.code !== 200 || !res.data) {
                        return;
                    }
                    var info = res.data;
                    if (info.name) {
                        document.getElementById('admSiteName').textContent = info.name + '后台管理';
                        document.title = info.name + '后台管理';
                    }
                    if (info.domain) {
                        var url = info.domain;
                        if (!/^(https?:)?\/\//.test(url)) {
                            url = 'http://' + url;
                        }
                        var link = document.getElementById('frontSiteLink');
                        link.href = url;
                        link.style.display = 'inline-flex';
                    }
                })['catch'](function () { /* 静默降级 */ });
            }
            document.getElementById('logoutBtn').onclick = function () {
                if (window.confirm('确定退出登录吗？')) {
                    document.getElementById('logoutForm').submit();
                }
            };
        })();
    </script>
</div>
