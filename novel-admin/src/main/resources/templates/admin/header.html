<div th:fragment="header" class="adm_header">
    <div class="adm_header_in">
        <a class="adm_header_logo" href="/">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span id="admSiteName" th:text="${headerSite.name}">小说精品屋后台管理</span>
        </a>
        <div class="adm_header_right">
            <!-- 前台站点：站点信息配了域名才渲染，地址由 PageController#headerSite 补齐协议前缀 -->
            <a class="adm_header_btn" id="frontSiteLink" th:if="${not #strings.isEmpty(headerSite.url)}"
               th:href="${headerSite.url}" target="_blank" rel="noopener">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <path d="M15 3h6v6"></path>
                    <path d="M10 14L21 3"></path>
                </svg>
                前台站点
            </a>
            <span class="adm_header_user">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span id="admUserName">管理员</span>
            </span>
            <!-- 修改自己的密码：任何已登录账号可用，弹窗逻辑在 admin.js 的 Admin.changePwd -->
            <a class="adm_header_btn" id="changePwdBtn" href="javascript:;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                </svg>
                修改密码
            </a>
            <a class="adm_header_btn adm_header_logout" id="logoutBtn" href="javascript:;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <path d="M16 17l5-5-5-5"></path>
                    <path d="M21 12H9"></path>
                </svg>
                退出
            </a>
        </div>
    </div>
    <!-- Spring Security 的 /logout 仅接受 POST，用隐藏表单提交（csrf 已全局禁用） -->
    <form id="logoutForm" action="/logout" method="post" style="display:none"></form>
    <!-- 各页面模板的 <title> 是静态文案，浏览器标题由服务端渲染的站点名统一覆盖 -->
    <script th:inline="javascript">document.title = /*[[${headerSite.name}]]*/ '小说精品屋后台管理';</script>
    <script>
        // 头部不依赖 jQuery（各页面 jQuery 在 body 末尾才加载），用原生 ES5 实现
        (function () {
            document.getElementById('logoutBtn').onclick = function () {
                if (window.confirm('确定退出登录吗？')) {
                    document.getElementById('logoutForm').submit();
                }
            };
            // 修改密码弹窗依赖 admin.js（各页面 body 末尾才加载），点击时再取，未加载则忽略
            document.getElementById('changePwdBtn').onclick = function () {
                if (window.Admin && window.Admin.changePwd) {
                    window.Admin.changePwd();
                }
            };
            // 当前登录账号（多账号后台下必须知道自己是谁）
            if (window.fetch) {
                fetch('/sys/auth/info').then(function (r) {
                    return r.json();
                }).then(function (res) {
                    if (!res || res.code !== 200 || !res.data || !res.data.username) {
                        return;
                    }
                    var name = res.data.displayName || res.data.username;
                    document.getElementById('admUserName').textContent = res.data.superAdmin ? name + '（超管）' : name;
                })['catch'](function () { /* 静默降级，保留“管理员”文案 */ });
            }
        })();
    </script>
</div>
