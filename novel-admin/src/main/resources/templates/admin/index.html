<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>

    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div class="a_welcome">
                    <h3>欢迎使用小说精品屋后台管理系统</h3>
                    <div class="a_cards">
                        <div class="a_card"><b>小说管理</b>
                            <a href="/book/book.html">小说列表</a>
                            <a href="/book/category.html">小说分类</a>
                            <a href="/bookList/bookList.html">书单管理</a>
                            <a href="/comment/bookComment.html">书评管理</a>
                            <a href="/comment/paragraph.html">段评管理</a>
                        </div>
                        <div class="a_card"><b>用户管理</b>
                            <a href="/member/user.html">会员列表</a>
                            <a href="/member/userFeedback.html">会员反馈</a>
                            <a href="/message/userMessage.html">消息管理</a>
                        </div>
                        <div class="a_card"><b>作家管理</b>
                            <a href="/author/author.html">作者列表</a>
                            <a href="/author/authorCode.html">邀请码管理</a>
                            <a href="/author/income.html">作家收入</a>
                        </div>
                        <div class="a_card"><b>内容运营</b>
                            <a href="/website/bookSetting.html">小说推荐</a>
                            <a href="/news/news.html">新闻列表</a>
                            <a href="/news/category.html">新闻类别</a>
                        </div>
                        <div class="a_card"><b>网站设置</b>
                            <a href="/website/websiteInfo.html">网站信息</a>
                            <a href="/website/friendLink.html">友情链接</a>
                        </div>
                        <div class="a_card"><b>订单管理</b>
                            <a href="/order/pay.html">订单列表</a>
                        </div>
                    </div>
                    <div class="a_chart_box">
                        <div class="a_chart_head"><b>增长趋势</b>
                            <select id="trendDays" class="a_chart_days">
                                <option value="7">近7天</option>
                                <option value="30" selected>近30天</option>
                                <option value="90">近90天</option>
                            </select>
                        </div>
                        <div id="trendChart" class="a_chart"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="https://unpkg.com/echarts@5.5.1/dist/echarts.min.js"></script>
<script>
    // 首页统计曲线：作品/会员/订单每日新增趋势
    (function () {
        if (!window.echarts) {
            $('#trendChart').html('<div style="padding:40px;text-align:center;color:#999;">图表库加载失败，请检查网络后刷新</div>');
            return;
        }
        var chart = echarts.init(document.getElementById('trendChart'));
        var COLORS = { book: '#3eaf7c', user: '#4a90d9', order: '#e6a23c' };
        var NAMES = { book: '作品新增', user: '会员新增', order: '订单新增' };

        function load(days) {
            $.get('/stat/trend', {days: days}, function (res) {
                if (!res || res.code !== 200) {
                    return;
                }
                var d = res.data;
                chart.setOption({
                    color: [COLORS.book, COLORS.user, COLORS.order],
                    tooltip: {trigger: 'axis'},
                    legend: {data: [NAMES.book, NAMES.user, NAMES.order], top: 4},
                    grid: {left: 46, right: 20, top: 40, bottom: 28},
                    xAxis: {type: 'category', boundaryGap: false, data: d.dates, axisLabel: {formatter: function (v) { return v.substring(5); }}},
                    yAxis: {type: 'value', minInterval: 1},
                    series: [
                        {name: NAMES.book, type: 'line', smooth: true, data: d.book},
                        {name: NAMES.user, type: 'line', smooth: true, data: d.user},
                        {name: NAMES.order, type: 'line', smooth: true, data: d.order}
                    ]
                });
            }, 'json');
        }

        $('#trendDays').on('change', function () {
            load($(this).val());
        });
        $(window).on('resize', function () {
            chart.resize();
        });
        load(30);
    })();
</script>
</html>
