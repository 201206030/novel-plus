<div th:fragment="menu" class="my_l">
    <!-- 侧栏由 sys_menu 渲染（PageController 注入 sideMenus）：
         目录作为分组标题，页面作为链接，顺序与「角色管理-菜单授权」完全一致 -->
    <ul class="log_list">
        <th:block th:each="item : ${sideMenus}">
            <li class="menu_group" th:if="${item.type == 0}" th:text="${item.name}"></li>
            <li th:unless="${item.type == 0}">
                <a class="link_1" th:href="${item.url}" th:text="${item.name}"></a>
            </li>
        </th:block>
        <li th:if="${sideMenus == null or #lists.isEmpty(sideMenus)}">
            <span class="menu_empty">当前账号没有可见菜单，请联系超级管理员在「系统管理-角色管理-菜单授权」中勾选页面</span>
        </li>
    </ul>
</div>
