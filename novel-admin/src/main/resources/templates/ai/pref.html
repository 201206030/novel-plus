<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>AI创作偏好-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    function showJson(title, text) {
        var html = '';
        if (text) {
            try {
                html = Admin.escape(JSON.stringify(JSON.parse(text), null, 2));
            } catch (e) {
                html = Admin.escape(String(text)).replace(/\n/g, '<br/>');
            }
        } else {
            html = '<span style="color:#999;">（空）</span>';
        }
        layer.open({type: 1, title: title, area: ['760px', '620px'],
            content: '<div class="content_view" style="padding:12px;white-space:pre-wrap;word-break:break-all;">' + html + '</div>'});
    }

    Admin.crud({
        api: '/ai/pref',
        title: 'AI创作偏好',
        searchPlaceholder: '输入笔名搜索',
        selectable: false,
        hasAdd: false,
        hasEdit: false,
        columns: [
            {title: 'ID', field: 'id', thClass: 'col_num'},
            {title: '作家', field: 'penName', thClass: 'time'},
            {title: '偏好内容', render: function (row) {
                var t = row.prefContent || '';
                return Admin.escape(t.length > 40 ? t.substring(0, 40) + '…' : (t || '-'));
            }},
            {title: '创建时间', thClass: 'col_time', render: function (row) {
                return Admin.fmt(row.createTime);
            }},
            {title: '更新时间', thClass: 'col_time', render: function (row) {
                return Admin.fmt(row.updateTime);
            }}
        ],
        rowActions: [
            {title: '详情', fn: function (row) {
                showJson('创作偏好 - ' + (row.penName || ''), row.prefContent);
            }}
        ]
    });
</script>
</html>
