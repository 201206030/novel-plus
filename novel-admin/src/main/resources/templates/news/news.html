<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>新闻列表-小说精品屋后台管理</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
    <!-- wangEditor v5 样式 -->
    <link rel="stylesheet" href="https://unpkg.com/@wangeditor/editor@5.1.23/dist/css/style.css"/>
</head>
<body class="">

<div th:replace="admin/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div th:replace="admin/menu :: menu">
        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div id="adminApp"></div>
            </div>
        </div>
    </div>
</div>

</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<!-- wangEditor v5 富文本编辑器 -->
<script src="https://unpkg.com/@wangeditor/editor@5.1.23/dist/index.js"></script>
<script src="/javascript/admin.js" type="text/javascript"></script>
<script th:inline="none">
    Admin.crud({
        api: '/news/news',
        title: '新闻列表',
        searchPlaceholder: '输入新闻标题搜索',
        selectable: true,
        addBtnText: '发布新闻',
        formWidth: '780px',
        formHeight: '640px',
        columns: [
            {title: '新闻标题', field: 'title'},
            {title: '类别', field: 'catName', thClass: 'time'},
            {title: '来源', field: 'sourceName', thClass: 'time'},
            {title: '阅读数', thClass: 'col_num', render: function (row) {
                return row.readCount || 0;
            }},
            {title: '发布时间', thClass: 'col_time', render: function (row) {
                return Admin.fmt(row.createTime);
            }}
        ],
        fields: [
            {name: 'catId', label: '新闻类别', type: 'select', optionsUrl: '/news/category/all',
                optionValue: 'id', optionLabel: 'name', required: true},
            {name: 'title', label: '新闻标题', required: true},
            {name: 'sourceName', label: '来源名称'},
            {name: 'content', label: '新闻内容', type: 'rich', required: true}
        ]
    });
</script>
</html>
