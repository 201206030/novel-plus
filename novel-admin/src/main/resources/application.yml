#端口号
server:
  port: 80
  servlet:
    session:
      timeout: 1D

spring:
  profiles:
    active: dev
  jackson:
    # Date 序列化按北京时间，避免列表时间显示比实际早 8 小时
    time-zone: GMT+8
  servlet:
    multipart:
      #富文本图片上传大小限制
      max-file-size: 5MB
      max-request-size: 20MB

#后台登录账号统一存于 sys_user 表（系统管理-用户维护），不再在配置文件中配置用户名密码
