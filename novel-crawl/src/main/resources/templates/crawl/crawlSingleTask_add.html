<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>新增单本采集任务 - 小说精品屋爬虫管理</title>
    <link rel="stylesheet" href="/css/base.css?v=2"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/crawl-menu.css?v=1"/>
    <link rel="stylesheet" href="/css/crawl-form.css?v=1"/>
</head>
<body>

<div th:replace="crawl/header :: header"></div>

<div class="main box_center cf crawl_form_page">
    <div class="userBox cf">
            <div th:replace="crawl/menu :: menu('single')"></div>
        <div class="my_r">
            <div class="crawl_form">
                <div class="frm_head">
                    <div>
                        <h3>新增单本采集任务</h3>
                        <p>按爬虫源与源站小说ID采集单本小说；<span class="frm_req">*</span> 为必填项，示例均为笔趣阁 www.mcmssc.com</p>
                    </div>
                    <a class="frm_back" href="/crawl/crawlSingleTask_list.html">返回列表</a>
                </div>

                <form id="form2" method="post" onsubmit="return false;">
                    <section class="frm_section">
                        <h4><span class="frm_step">01</span>采集信息</h4>
                        <div class="frm_grid">
                            <div class="frm_row">
                                <label for="sourceId">采集源 <span class="frm_req">*</span></label>
                                <select id="sourceId" class="frm_input"></select>
                                <p class="frm_tip">从已配置的爬虫源中选择</p>
                            </div>
                            <div class="frm_row">
                                <label for="catId">采集分类 <span class="frm_req">*</span></label>
                                <select id="catId" class="frm_input">
                                    <option value="">分类加载中…</option>
                                </select>
                                <p class="frm_tip">系统分类按男频 / 女频分组展示</p>
                            </div>
                            <div class="frm_row">
                                <label for="sourceBookId">源站小说ID <span class="frm_req">*</span></label>
                                <input type="text" id="sourceBookId" class="frm_input frm_rule" placeholder="例如：73_73911"/>
                                <p class="frm_tip">示例：<code>73_73911</code></p>
                            </div>
                            <div class="frm_row">
                                <label for="bookName">小说名 <span class="frm_req">*</span></label>
                                <input type="text" id="bookName" class="frm_input" placeholder="例如：苏厨"/>
                                <p class="frm_tip">示例：<code>苏厨</code></p>
                            </div>
                            <div class="frm_row">
                                <label for="authorName">小说作者 <span class="frm_req">*</span></label>
                                <input type="text" id="authorName" class="frm_input" placeholder="例如：二子从周"/>
                                <p class="frm_tip">示例：<code>二子从周</code></p>
                            </div>
                        </div>
                    </section>

                    <div class="frm_actions">
                        <span class="frm_note">提交后将按所选爬虫源的规则采集该小说</span>
                        <a class="frm_btn_ghost" href="/crawl/crawlSingleTask_list.html">取消</a>
                        <input type="button" class="frm_btn" onclick="addCrawlSingleTask()" value="保存并提交"/>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>

<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script language="javascript" type="text/javascript">
    $(function () {
        loadBookCategories();
        $.ajax({
            type: "get",
            url: "/crawl/listCrawlByPage",
            data: {'curr': 1, 'limit': 100},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var crawlSourceList = data.data.list;
                    if (crawlSourceList.length > 0) {
                        var crawlSourceListHtml = "";
                        for (var i = 0; i < crawlSourceList.length; i++) {
                            var crawlSource = crawlSourceList[i];
                            crawlSourceListHtml += ("<option value=\"" + crawlSource.id + "\">" + crawlSource.sourceName + "</option>");
                        }
                        $("#sourceId").html(crawlSourceListHtml);


                    }


                } else if (data.code == 1001) {
                    //未登录
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })
    });

    /**
     * 采集分类从book_category动态加载，按男频/女频分组（workDirection 0/空为男频，1为女频）
     */
    function loadBookCategories() {
        $.ajax({
            type: "get",
            url: "/crawl/listBookCategory",
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var cats = data.data || [];
                    var boyHtml = "", girlHtml = "";
                    for (var i = 0; i < cats.length; i++) {
                        var cat = cats[i];
                        var option = '<option value="' + cat.id + '">' + escapeHtml(cat.name) + '</option>';
                        if (String(cat.workDirection) === '1') {
                            girlHtml += option;
                        } else {
                            boyHtml += option;
                        }
                    }
                    var catListHtml = "";
                    if (boyHtml) {
                        catListHtml += '<optgroup label="男频">' + boyHtml + '</optgroup>';
                    }
                    if (girlHtml) {
                        catListHtml += '<optgroup label="女频">' + girlHtml + '</optgroup>';
                    }
                    $("#catId").html(catListHtml || '<option value="">暂无分类</option>');
                } else if (data.code == 1001) {
                    //未登录
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
                } else {
                    $("#catId").html('<option value="">分类加载失败</option>');
                }
            },
            error: function () {
                $("#catId").html('<option value="">分类加载失败</option>');
            }
        });
    }

    function escapeHtml(str) {
        return String(str == null ? '' : str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }


    function addCrawlSingleTask() {

        var sourceId = $("#sourceId").find("option:selected").val();

        var catId = $("#catId").find("option:selected").val();

        if (!catId) {
            layer.alert("采集分类加载异常，请刷新重试");
            return;
        }

        var sourceName = $("#sourceId").find("option:selected").html();


        var sourceBookId = $("#sourceBookId").val();

        if (!sourceBookId) {
            layer.alert("采集的源站小说ID不能为空");
            return;
        }

        var bookName = $("#bookName").val();

        if (!bookName) {
            layer.alert("采集的小说名不能为空");
            return;
        }

        var authorName = $("#authorName").val();

        if (!authorName) {
            layer.alert("采集的小说作者名不能为空");
            return;
        }

        $.ajax({
            type: "POST",
            url: "/crawl/addCrawlSingleTask",
            data: {
                'sourceId': sourceId,
                'sourceName': sourceName,
                'catId': catId,
                'sourceBookId': sourceBookId,
                'bookName': bookName,
                'authorName': authorName
            },
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {

                    window.location.href = '/crawl/crawlSingleTask_list.html';


                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert('网络异常');
            }
        })

    }

</script>
</html>
