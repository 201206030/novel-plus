<div th:fragment="header" class="adm_header">
    <div class="adm_header_in">
        <a class="adm_header_logo" href="/">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span>小说精品屋爬虫管理</span>
        </a>
        <div class="adm_header_right">
            <a class="adm_header_btn" href="/crawl/crawlSource_list.html">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                    <path d="M2 17l10 5 10-5"></path>
                    <path d="M2 12l10 5 10-5"></path>
                </svg>
                爬虫源管理
            </a>
            <a class="adm_header_btn" href="/crawl/crawlSource_test.html" target="_blank" rel="noopener">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 17l6-6-6-6"></path>
                    <path d="M12 19h8"></path>
                </svg>
                规则测试
            </a>
            <span class="adm_header_user">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                管理员
            </span>
            <a class="adm_header_btn adm_header_logout" id="logoutBtn" href="javascript:;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <path d="M16 17l5-5-5-5"></path>
                    <path d="M21 12H9"></path>
                </svg>
                退出
            </a>
        </div>
    </div>
    <!-- Spring Security 的 /logout 用隐藏表单提交（csrf 已全局禁用），与后台管理保持一致 -->
    <form id="logoutForm" action="/logout" method="post" style="display:none"></form>
    <script>
        // 头部不依赖 jQuery（各页面 jQuery 在 body 末尾才加载），用原生 ES5 实现
        (function () {
            document.getElementById('logoutBtn').onclick = function () {
                if (window.confirm('确定退出登录吗？')) {
                    document.getElementById('logoutForm').submit();
                }
            };
        })();
    </script>
</div>
