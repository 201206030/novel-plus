#端口号
server:
  port: 8081
  servlet:
    session:
      timeout: 1D
  tomcat:
    #规整表单/文件上传体积上限，避免大书源文件请求被截断
    max-http-form-post-size: 50MB
    max-swallow-size: 50MB

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      #大书源规则文件上传上限
      max-file-size: 50MB
      max-request-size: 50MB

#登录用户名密码
admin:
  username: admin
  password: admin



crawl:
  update:
    #爬虫自动更新的线程数
    #建议小说数量不多或者正在运行新书入库爬虫的情况下设置为1即可
    #随着小说数量的增多可以逐渐增加，但建议不要超出CPU的线程数
    thread: 1
  # 采集间隔时间，单位：毫秒
  interval:
    min: 300
    max: 500


---

#邮箱服务器
spring:
  mail:
    host: smtp.163.com
    #发件人昵称
    nickname: novel-plus
    #邮箱账户
    username: xxyopen@163.com
    #邮箱第三方授权码
    password: novel123456
    #编码类型
    default-encoding: UTF-8
    port: 465
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: rue
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false

# 磁盘监控配置
disk-monitor:
  enabled: false
  interval-minutes: 5
  warning-threshold: 85.0
  severe-threshold: 90.0
  critical-threshold: 95.0
  # 告警邮件接收人列表（支持多个邮箱）
  recipients: xxyopen@foxmail.com,12345678@qq.com

---
# --------------------- Spring AI 配置（AI 辅助生成爬虫规则）----------------------
# api-key 优先读环境变量 AI_API_KEY；默认值与 novel-front 保持一致，仅用于开箱即用。
# 生产环境请务必通过环境变量覆盖，避免密钥明文入库。
spring:
  ai:
    openai:
      api-key: ${AI_API_KEY:sk-xfobmihqsrdsepveoxqkgetafrelariuquzstquoeunkszgl}
      base-url: ${AI_BASE_URL:https://api.siliconflow.cn}
      chat:
        options:
          model: ${AI_MODEL:tencent/Hy4-preview}

# AI 规则生成的调用参数（超时/截断长度/简单频率限制）
crawl:
  ai:
    # 单次模型调用硬超时（秒）
    timeout-seconds: 300
    # 每个示例页面送入模型的 HTML 最大字符数（剔除 script/style/注释后截断）
    # 采用按页面分批发给模型，单批只含一个页面，故可调大以覆盖页面中后部的字段
    max-html-chars: 24000
    # 同一 IP 两次生成请求的最小间隔（秒），防止连点刷额度
    min-interval-seconds: 5


